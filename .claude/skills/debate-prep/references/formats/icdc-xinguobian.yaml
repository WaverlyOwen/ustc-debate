# 依据：新国辩组委会 2015 年赛制革新说明（总计时自由分配制、每环节≥1 分钟、自由辩各 4 分钟另计、评审逐环节打分），
# 维基百科与流传的《新国辩 17 分钟赛制》文本（环节顺序、质询规则、三轮投票制），2025/2026 两届官方赛果反推评审人数。
# 当届官方章程正文未公开检索到，见 unconfirmed。
id: icdc-xinguobian
name: 国际华语辩论邀请赛
aliases: [新国辩, 国辩, bilibili新国辩, ICDC, 国际华语辩论邀请赛]
teams: 4v4
level_default: 高水平
speech_rate: [290, 320]
first_opening: 正方
first_closing: 反方
evidence_strict: false
positions: [一辩, 二辩, 三辩, 四辩]

# 六个个人环节共用本队 17 分钟，seconds 是建议分配（合计 1020 秒），备赛时每篇稿件另备一个可压缩版本
time_pool:
  seconds: 1020
  stages: [1, 2, 5, 6, 9, 12]
  min_per_stage: 60
  note: 每队 17 分钟由队伍临场自由分配到陈词一、质询一、陈词二、质询二、质询小结、总结六个环节，每环节不少于 1 分钟；自由辩论各 4 分钟另计

stages:
  - {n: 1,  name: 正方一辩陈词（陈词一）,       type: 立论,   side: 正方, speaker: 正一, seconds: 180, timing: 单方,   block: A}
  - {n: 2,  name: 反方四辩质询正方一辩（质询一）, type: 质询,   side: 反方, asker: 反四, target: 正一, seconds: 120, timing: 单边计时, block: A, questions: [3, 4, 8, 12]}
  - {n: 3,  name: 反方一辩陈词（陈词一）,       type: 立论,   side: 反方, speaker: 反一, seconds: 180, timing: 单方,   block: A}
  - {n: 4,  name: 正方四辩质询反方一辩（质询一）, type: 质询,   side: 正方, asker: 正四, target: 反一, seconds: 120, timing: 单边计时, block: A, questions: [3, 4, 8, 12]}
  - {n: 5,  name: 正方二辩陈词（陈词二）,       type: 申论,   side: 正方, speaker: 正二, seconds: 180, timing: 单方,   block: B, short: 陈词, reserve_seconds: 40}
  - {n: 6,  name: 反方三辩质询正方二辩（质询二）, type: 质询,   side: 反方, asker: 反三, target: 正二, seconds: 120, timing: 单边计时, block: B, questions: [3, 4, 8, 12]}
  - {n: 7,  name: 反方二辩陈词（陈词二）,       type: 申论,   side: 反方, speaker: 反二, seconds: 180, timing: 单方,   block: B, short: 陈词, reserve_seconds: 50}
  - {n: 8,  name: 正方三辩质询反方二辩（质询二）, type: 质询,   side: 正方, asker: 正三, target: 反二, seconds: 120, timing: 单边计时, block: B, questions: [3, 4, 8, 12]}
  - {n: 9,  name: 反方三辩质询小结,             type: 小结,   side: 反方, speaker: 反三, seconds: 150, timing: 单方,   block: C, short: 质询小结}
  - {n: 10, name: 正方三辩质询小结,             type: 小结,   side: 正方, speaker: 正三, seconds: 150, timing: 单方,   block: C, short: 质询小结, reserve_seconds: 40}
  - {n: 11, name: 自由辩论,                     type: 自由辩, side: 双方, speaker: 全员, seconds: 240, timing: 各自计时, block: D}
  - {n: 12, name: 反方四辩总结陈词,             type: 结辩,   side: 反方, speaker: 反四, seconds: 270, timing: 单方,   block: E, style: 封路式, short: 总结陈词}
  - {n: 13, name: 正方四辩总结陈词,             type: 结辩,   side: 正方, speaker: 正四, seconds: 270, timing: 单方,   block: E, reserve_seconds: 45, short: 总结陈词}

meta_overrides:
  13: 正文 NNN 字 / 270 秒，留 40–50 秒临场回应

blocks:
  A: 陈词一 + 质询一（环节票约 40 分）：定义与判准在一辩陈词里立住；四辩质询拿到对方一个关键承认；被质询时只作答不反问，回答短而准（被质询方也单独计分）
  B: 陈词二 + 质询二（约 40 分）：二辩陈词把对方立论的核心问题讲给评审听并推进本方机制；三辩质询完成问题链、逼出口径矛盾
  C: 质询小结（约 10 分）：把两轮质询成果与本方论点接上，给评审一张「目前战况表」
  D: 自由辩论（约 20 分，单环节最高）：主战场推进到位，对方必答问题都正面回应过；时间用尽即无法再发言
  E: 总结（约 10 分）：回到判准与一句话立论，处理对方全场最强点；反四封路、正四真回应

scoring: |
  三轮投票制：每位评审三票。印象票看整场，不得弃权或平分；环节票由评审在比赛进行中逐环节打分累计（约 100 分制），总分高的一方得该票，平分则该票不投出；
  第三票（商讨票 / 决胜票）在评审公开评述、相互商讨后投出。全体评审三轮票数相加，多者胜；出现平局则只按第三轮定胜负。评审公开述票。
  初赛 / 复赛通常 3 位评审（一场 9 票，官方赛果如 5:4、9:0），半决赛 / 决赛 5 位（15 票，2025 决赛 8:7，2026 决赛 15:0）。
  最佳辩手由每位评审提名三人记 3/2/1 分累计。双方发言合计 42 分钟，一场连评述约 60–75 分钟。

notes: |
  没有驳论、对辩、盘问环节：驳论的功能塞进二辩陈词二（type 申论），盘问的功能由三辩质询二承担，三辩还要做质询小结，是最忙的辩位。不要套大陆模板。
  质询只计质询方时间，被质询方回答不扣时；质询方可打断，被质询方只能作答不得反问。质询对象固定：四辩问对方一辩，三辩问对方二辩。
  自由辩各 4 分钟另计，正方先开口，此后交替；剩 30 秒一声哨，用尽两声哨。自由辩是单环节最高分，但它和 17 分钟是两个不相通的口袋。
  正方先陈词、先自由辩；反方先小结、先总结。反一开口前已听完正一陈词与本方四辩质询，开头一句钉住质询成果再立论。
  评审边听边打环节分、赛后公开述票；组委会明确表示刻意压缩弱势辩手环节时间的队伍会在环节分上吃亏。打法见 icdc-xinguobian.md。

