unconfirmed:
  - 总结陈词顺序：多数来源写反方四辩先、正方四辩后，一处低质量来源写抽签决定；本文件取反方先，赛前向组委会确认
  - 质询小结先反方后正方来自流传文本与衍生赛制，未见官方章程原文
  - 各环节 seconds 是按常见分配推断的建议值；官方只规定 17 分钟总量与每环节不少于 1 分钟，允许临场调整
  - 现行 17 分钟与 2015 年的 19 分钟不一致，改动年份未查到；2025/2026 届是否仍为 17 分钟未见当届章程原文
  - 陈词二映射为 申论：章程未限定内容，实战多为驳论加申论
  - 环节票分值表（陈词一 10、质询一 10+10、陈词二 10、质询二 10+10、小结 10、自由辩 20、总结 10）取自衍生赛事文本，高校组是否相同待确认
  - 第三票名称（商讨票 / 决胜票）、评审是否每场公开述票、评审人数（3 / 5）由官方票数反推，非章程原文
  - 未找到虚假论据或 AI 生成数据的判负条款；2025 年一场伪证争议组委会未公开裁定。evidence_strict 填 false，但顶级评审会当场核证，稿件仍只用已核实数据
  - 自由辩「一方用尽后另一方可继续」与哨声规则来自流传文本；高校组是否设战术暂停未见记载，按无处理
