  - {url: "https://www.guet.edu.cn/gra/2026/0303/c6072a149014/page.htm", accessed: "2026-09-19", note: 桂林电子科技大学 2026-03-03 通知，明确采用华语辩论世界杯赛制（黄金联赛赛制），环节条文与 2019 章程逐字一致；三评委三票制为校方转述}
  - {url: "https://debatetimer.cn/record/6760152b3fd6846b0be83edd", accessed: "2026-09-19", note: 2024 西区 B 组计时器实录，环节顺序与章程一致}
  - {url: "https://www.chinanews.com.cn/sh/2026/07-13/10658637.shtml", accessed: "2026-09-19", note: 中新网：2026 总决赛北京首钢园，24 校 39 场，评判维度}
  - {url: "https://www.sohu.com/a/1052213745_121106842", accessed: "2026-09-19", note: 2026 总决赛人大 5:0 胜澳门大学，决赛评委 5 人}
  - {url: "https://www.bianlun.net/?id=113", accessed: "2026-09-19", note: 华语辩论网 2026-08-05：每位评委述票不超过 5 分钟已写在章程里}
  - {url: "https://www.chinanews.com.cn/gn/2024/07-13/10250950.shtml", accessed: "2026-09-19", note: 2024 总决赛北大 4:1 胜牛津，5 位评委}

unconfirmed:
  - 14 个环节的时长取自 2019 章程，以 2026 桂电通知与 2024 赛区实录旁证；2024–2026 总决赛官方章程未公开，赛前向组委会或赛区确认时长有无调整
  - 2024 赛区赛两份计时器实录的主持词报「一辩 3 分钟、二辩小结 2 分钟、三辩盘问 1 分 30 秒」，与章程不同，可能是赛区自改；确认所在赛区版本
  - 票制：赛区赛「3 位评委 × 印象票 / 环节票 / 决胜票」来自校方转述；总决赛每人 1 票还是 3 票两种口径并存
  - 述票不超过 5 分钟来自评论文章转述，非章程原文
  - 章程未见虚假论据或 AI 生成数据的判负条款，evidence_strict 按 false 填；但高水平赛事评委会当场追问出处，论据仍按已核实准备
  - 有转述称设观众提问环节（各一问，不影响结果），未定位到原文，未列入 stages
  - 质询与盘问的链数、问题数按时长推断；正二小结、反三小结、正四结辩的临场位秒数按「后发言者留临场位」的常见做法推断
