name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the Pages site and the working copy of the offline timer
        run: python3 timer/build.py
      - name: Check both builds
        run: python3 timer/build.py --check
      - name: Refresh tracked artifacts on main
        run: |
          git add -- timer/ustc-debate-timer.html timer/src/builtin-formats.js timer/src/index.html
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh generated timer files'
            git push origin HEAD:refs/heads/main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: timer/dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
