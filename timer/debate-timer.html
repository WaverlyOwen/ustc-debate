<style>
/* === styles/base.css === */
/* base.css: the theme variable contract with 堂 (hall) defaults, a small reset, and the stage's size basis. */

/* The contract every theme defines (spec §5.6). These defaults are hall's values. */
:root {
  --pro: #B8322A;
  --pro-deep: #521511;
  --con: #1D4E89;
  --con-deep: #0C2340;
  --ground: #2A2D33;
  --ink: #F4EFE4;
  --ink-dim: rgb(244 239 228 / .6);
  --accent: #E4B04A;
  --font-digits: "Bahnschrift", "DIN Alternate", "Segoe UI", sans-serif;
  --font-title: "Noto Serif SC", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
  --font-ui: "Microsoft YaHei UI", "Microsoft YaHei", "DengXian", system-ui, sans-serif;
  --backdrop: none;
}

*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-ui);
}

/* The host decides the size; everything on the stage is sized in container units (cqh / cqw),
   so a shrunken preview on the console and the full-screen projection keep the same proportions. */
.dt-stage-host {
  container-type: size;
  position: relative;
  overflow: hidden;
}

.dt-stage {
  position: absolute;
  inset: 0;
  /* Optional contract extras with derived defaults; a theme may override them. */
  --on-side: var(--ink);        /* text drawn on a side colour (digits, team names) */
  --used: 0;
  --tension: 0;
  --warn-at: 0;
}

.dt-stage [hidden] { display: none !important; }

/* The page shell ui.js mounts into fills the window. */
.dt-app { height: 100%; }

/* === styles/stage.css === */
/* stage.css: the projected stage (spec §5.3–5.5). Colours and fonts come only from the theme variables. */

/* ---- frame ---- */

.dt-stage {
  --side-color: color-mix(in oklab, var(--ground) 90%, var(--ink));
  --side-deep: var(--ground);
  --clock-y: 55%;                 /* vertical centre of the main digits */
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-spring: cubic-bezier(.34, 1.36, .64, 1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  isolation: isolate;
  padding: 4.2cqh 5cqw 3.6cqh;
  background: var(--side-deep);
  color: var(--ink);
  font-family: var(--font-ui);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
.dt-stage[data-side="pro"] { --side-color: var(--pro); --side-deep: var(--pro-deep); }
.dt-stage[data-side="con"] { --side-color: var(--con); --side-deep: var(--con-deep); }

/* ---- layers, bottom to top: backdrop, deco, field / halves, warn line, content, rings, toast ---- */

.dt-backdrop, .dt-deco, .dt-field, .dt-warnline, .dt-halves, .dt-rings {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.dt-backdrop { z-index: 0; background: var(--backdrop); }
.dt-deco { z-index: 1; }
.dt-field, .dt-halves { z-index: 2; }
.dt-warnline { z-index: 3; }
.dt-top, .dt-head, .dt-clock, .dt-card, .dt-bottom { position: relative; z-index: 4; }
.dt-rings { z-index: 5; overflow: hidden; }
.dt-toast { z-index: 6; }

/* The colour field: time is taken back toward the speaking side's own seat. */
.dt-field {
  background: var(--side-color);
  clip-path: inset(0 calc(var(--used) * 100%) 0 0);
}
.dt-stage[data-pro-seat="right"][data-side="pro"] .dt-field,
.dt-stage[data-pro-seat="left"][data-side="con"] .dt-field {
  clip-path: inset(0 0 0 calc(var(--used) * 100%));
}
.dt-stage:not([data-mode="stage"]) .dt-field,
.dt-stage[data-kind="dual"] .dt-field { display: none; }

/* A gold hairline where the warn bell sits, visible until the field has been taken back past it. */
.dt-warnline {
  right: auto;
  left: calc(var(--warn-at) * 100%);
  width: 2px;
  margin-left: -1px;
  background: var(--accent);
  /* Faint behind the title and digits, full strength near the floor where the eye reads the field's edge. */
  -webkit-mask-image: linear-gradient(to bottom, rgb(0 0 0 / .2) 0 45%, #000 85% 100%);
  mask-image: linear-gradient(to bottom, rgb(0 0 0 / .2) 0 45%, #000 85% 100%);
  transition: opacity 400ms ease;
}
.dt-stage[data-pro-seat="right"][data-side="pro"] .dt-warnline,
.dt-stage[data-pro-seat="left"][data-side="con"] .dt-warnline {
  left: calc((1 - var(--warn-at)) * 100%);
}
.dt-stage:not([data-mode="stage"]) .dt-warnline,
.dt-stage:not([data-kind="single"]) .dt-warnline { display: none; }
.dt-stage:not([data-phase="calm"]) .dt-warnline { opacity: 0; }

/* ---- top bar ---- */

.dt-top {
  display: flex;
  justify-content: space-between;
  gap: 4cqw;
  min-height: 1.4em;
  font-size: 2cqh;
  letter-spacing: .08em;
  color: var(--ink-dim);
}
.dt-top span { max-width: 48%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* ---- stage name and speaker ---- */

.dt-head { margin-top: 4.5cqh; max-width: 82cqw; }
.dt-title {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  margin: 0;
  font-family: var(--font-title);
  font-size: 5.6cqh;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: .04em;
  overflow-wrap: anywhere;
}
.dt-stage[data-long="true"] .dt-title { font-size: 4.2cqh; }
.dt-speaker {
  margin: 1.3cqh 0 0;
  overflow: hidden;
  font-size: 2.8cqh;
  letter-spacing: .06em;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: var(--ink-dim);
}
.dt-speaker:empty { display: none; }
.dt-stage[data-mode="title"] .dt-head { display: none; }

/* ---- digits ---- */

.dt-clock { line-height: 1; }
.dt-clock[data-clock="main"] {
  position: absolute;
  left: 50%;
  top: var(--clock-y);
  translate: -50% -50%;
}
.dt-stage:not([data-mode="stage"]) .dt-clock[data-clock="main"],
.dt-stage[data-kind="dual"] .dt-clock[data-clock="main"] { display: none; }
.dt-stage[data-kind="single"] .dt-clock { color: var(--on-side); }

.dt-digits {
  display: flex;
  align-items: baseline;
  justify-content: center;
  white-space: nowrap;
  font-family: var(--font-digits);
  font-size: min(38cqh, 30cqw);
  font-variant-numeric: tabular-nums;
  /* Tension: light and wide when the clock is full, heavy and narrow at zero (spec §5.3). */
  font-variation-settings: "wght" calc(300 + 400 * var(--tension)), "wdth" calc(100 - 22 * var(--tension));
  letter-spacing: -.01em;
  /* Numerals have no descenders: drop them a little so the glyphs, not the line box, sit on the centre line. */
  translate: 0 .07em;
  transition: color 300ms ease;
}
.dt-colon { padding: 0 .03em; opacity: .55; transition: color 300ms ease; }
.dt-clock[data-running="true"] .dt-colon { animation: dt-breathe 1000ms ease-in-out infinite; }
.dt-clock[data-phase="warn"] .dt-colon,
.dt-clock[data-phase="count"] .dt-colon { color: var(--accent); }
.dt-clock[data-phase="over"] .dt-digits { color: var(--accent); }
.dt-sign { margin-right: .04em; }
.dt-sign:empty { display: none; }
.dt-clock[data-phase="over"] .dt-sign { animation: dt-breathe 2000ms ease-in-out infinite; }
.dt-clock.is-bump .dt-digits { animation: dt-bump 240ms ease-out; }

/* 「暂停」 hangs below the digits without moving them. */
.dt-state {
  position: absolute;
  top: 100%;
  left: 50%;
  translate: -50% 0;
  margin-top: 1.4cqh;
  font-size: 2.8cqh;
  letter-spacing: .5em;
  text-indent: .5em;
  white-space: nowrap;
  opacity: .72;
  transition: opacity 200ms ease;
}
.dt-state:empty { opacity: 0; }

/* ---- dual: two halves by seat, the speaking side widens to 58% ---- */

.dt-halves {
  display: none;
  grid-template-columns: var(--left-col, 50%) var(--right-col, 50%);
  transition: grid-template-columns 520ms var(--ease-spring);
}
.dt-stage[data-mode="stage"][data-kind="dual"] .dt-halves { display: grid; }
.dt-stage[data-kind="dual"] .dt-top,
.dt-stage[data-kind="dual"] .dt-bottom::before { display: none; }
.dt-stage[data-kind="dual"] .dt-head { margin-top: 6cqh; max-width: 36cqw; }

.dt-half {
  --side-color: var(--pro);
  --side-deep: var(--pro-deep);
  position: relative;
  min-width: 0;
  overflow: hidden;
  background: var(--side-deep);
  transition: filter 300ms ease;
}
.dt-half[data-side="con"] { --side-color: var(--con); --side-deep: var(--con-deep); }
.dt-half + .dt-half { box-shadow: inset 1px 0 0 color-mix(in oklab, var(--ink) 16%, transparent); }
.dt-halves:not([data-idle]) .dt-half:not([data-active]) { filter: saturate(.45) brightness(.78); }

/* Each half is its side's field, drained from the top like a falling water level. */
.dt-half-field {
  position: absolute;
  inset: auto 0 0;
  height: calc(var(--remain, 1) * 100%);
  background: var(--side-color);
  clip-path: inset(0);
}

.dt-team {
  position: absolute;
  z-index: 1;
  top: 4.2cqh;
  left: 5cqw;
  right: 5cqw;
  display: flex;
  align-items: baseline;
  gap: .7em;
  overflow: hidden;
  white-space: nowrap;
  font-family: var(--font-title);
  font-size: 3.2cqh;
  color: var(--on-side);
}
.dt-half:last-child .dt-team { flex-direction: row-reverse; }
.dt-team:not([data-label=""])::before {
  content: attr(data-label);
  font-family: var(--font-ui);
  font-size: .7em;
  letter-spacing: .3em;
  opacity: .75;
}

.dt-half .dt-clock {
  position: absolute;
  z-index: 1;
  left: 50%;
  top: 52%;
  translate: -50% -50%;
  color: var(--on-side);
}
.dt-half .dt-digits {
  font-size: min(15cqh, 9cqw);
  transition: font-size 520ms var(--ease-spring), color 300ms ease;
}
.dt-halves[data-idle] .dt-digits { font-size: min(24cqh, 14cqw); }
.dt-half[data-active] .dt-digits { font-size: min(30cqh, 17cqw); }
.dt-half[data-locked] .dt-digits { display: none; }
.dt-half[data-locked] .dt-state {
  position: static;
  translate: none;
  margin: 0;
  font-family: var(--font-title);
  font-size: 6cqh;
  letter-spacing: .3em;
  opacity: .92;
}

/* The speaker's gold floor line opens from the middle outward. */
.dt-floorline {
  position: absolute;
  z-index: 1;
  left: 14%;
  right: 14%;
  bottom: 18cqh;
  height: .4cqh;
  border-radius: .2cqh;
  background: var(--accent);
  transform: scaleX(0);
  transition: transform 520ms var(--ease-out);
}
.dt-half[data-active] .dt-floorline { transform: scaleX(1); }

/* ---- cards: title, break, end ---- */

.dt-card { display: none; flex-direction: column; }
.dt-stage[data-mode="title"] .dt-card,
.dt-stage[data-mode="end"] .dt-card,
.dt-stage[data-mode="stage"][data-kind="break"] .dt-card { display: flex; }

.dt-motions { display: flex; flex-direction: column; gap: 2.2cqh; }
.dt-motion {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  position: relative;
  overflow: hidden;
  margin: 0;
  padding-left: .85em;
  font-family: var(--font-title);
  line-height: 1.32;
  letter-spacing: .03em;
  overflow-wrap: anywhere;
}
.dt-motion::before {
  content: "";
  position: absolute;
  left: 0;
  top: .16em;
  width: .2em;
  height: 1em;
  background: var(--pro);
}
.dt-motion[data-side="con"]::before { background: var(--con); }

.dt-teams { display: none; }
.dt-record { display: none; }
.dt-stage[data-mode="end"] .dt-motions { display: none; }
.dt-stage[data-mode="end"] .dt-record { display: table; }

/* Title card: motions in the upper half, the two teams by seat in the lower half, both on the centre axis. */
.dt-stage[data-mode="title"] .dt-card { flex: 1; justify-content: center; gap: 11cqh; padding: 0 3cqw; }
.dt-stage[data-mode="title"] .dt-motions { align-self: center; }
.dt-stage[data-mode="title"] .dt-motion { max-width: 84cqw; font-size: 6cqh; }
.dt-stage[data-mode="title"] .dt-teams {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  font-family: var(--font-title);
  font-size: 4.4cqh;
  line-height: 1.25;
}
.dt-teams::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 8%;
  bottom: 8%;
  width: 1px;
  background: var(--ink-dim);
}
.dt-teams span { min-width: 0; padding: 0 4cqw; overflow-wrap: anywhere; }
.dt-teams span:first-child { text-align: right; }
.dt-teams span:not([data-label=""])::before {
  content: attr(data-label);
  display: block;
  margin-bottom: 1.2cqh;
  font-family: var(--font-ui);
  font-size: .5em;
  letter-spacing: .4em;
  color: color-mix(in oklab, var(--pro) 50%, var(--ink));
}
.dt-teams span[data-side="con"]::before { color: color-mix(in oklab, var(--con) 45%, var(--ink)); }

/* Break: name, relaxed digits and the motions, centred as one group. */
.dt-stage[data-mode="stage"][data-kind="break"] .dt-head { margin: auto auto 0; max-width: 86cqw; text-align: center; }
.dt-stage[data-mode="stage"][data-kind="break"] .dt-clock[data-clock="main"] {
  position: relative;
  left: auto;
  top: auto;
  translate: none;
  margin-top: 3cqh;
}
.dt-stage[data-kind="break"] .dt-digits { font-size: 22cqh; }
.dt-stage[data-mode="stage"][data-kind="break"] .dt-card { margin: 7cqh auto auto; max-width: 86cqw; }
.dt-stage[data-mode="stage"][data-kind="break"] .dt-motion { font-size: 3.4cqh; }
.dt-stage[data-mode="stage"][data-kind="break"] .dt-bottom { margin-top: 0; }

/* End card: the match record, sized so every row fits; like the title card it sits on the centre axis. */
.dt-stage[data-mode="end"] .dt-head { align-self: center; text-align: center; }
.dt-stage[data-mode="end"] .dt-card { margin-top: 3.6cqh; min-height: 0; }
.dt-record {
  align-self: center;
  border-collapse: collapse;
  font-size: min(2cqh, calc(62cqh / var(--rows, 20) / 1.5));
  line-height: 1.5;
}
.dt-record th, .dt-record td { padding: 0 4em 0 0; text-align: left; white-space: nowrap; }
.dt-record th {
  padding-bottom: .35em;
  border-bottom: 1px solid color-mix(in oklab, var(--ink) 22%, transparent);
  font-weight: normal;
  letter-spacing: .2em;
  color: var(--ink-dim);
}
.dt-record tr:nth-child(2) td { padding-top: .45em; }
.dt-record td:first-child { max-width: 56cqw; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-title); }
.dt-record td:first-child::before {
  content: "";
  display: inline-block;
  width: .5em;
  height: .5em;
  margin-right: .8em;
  vertical-align: .12em;
  background: color-mix(in oklab, var(--ground) 50%, var(--ink));
}
.dt-record tr[data-side="pro"] td:first-child::before { background: var(--pro); }
.dt-record tr[data-side="con"] td:first-child::before { background: var(--con); }
.dt-record td:not(:first-child) { font-family: var(--font-digits); font-variant-numeric: tabular-nums; }
.dt-record tr[data-over] td:nth-child(n+3) { color: var(--accent); }
.dt-record tr[data-skipped] { opacity: .45; }

/* ---- bottom bar: progress and what comes next ---- */

.dt-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4cqw;
  margin-top: auto;
  font-size: 2cqh;
  color: var(--ink-dim);
}
.dt-bottom::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: -7cqh -5cqw -3.6cqh;
  background: linear-gradient(to top, color-mix(in oklab, var(--side-deep) 55%, transparent), transparent);
}

.dt-progress { display: flex; align-items: flex-end; gap: .35cqh; min-width: 0; }
.dt-seg {
  --seg: color-mix(in oklab, var(--ground) 45%, var(--ink));
  position: relative;
  display: block;
  flex: none;
  width: 1.7cqh;
  height: 1cqh;
  border-radius: .2cqh;
  background: var(--seg);
  box-shadow: 0 0 0 1px color-mix(in oklab, var(--ink) 22%, transparent);
  opacity: .35;
}
.dt-seg[data-side="pro"] { --seg: var(--pro); }
.dt-seg[data-side="con"] { --seg: var(--con); }
.dt-seg[data-kind="dual"] { background: linear-gradient(90deg, var(--pro) 50%, var(--con) 50%); }
.dt-seg[data-gap] { margin-left: 1.1cqh; }
.dt-seg[data-state="done"], .dt-seg[data-state="current"] { opacity: 1; }
.dt-seg[data-state="current"]::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -.75cqh;
  height: .35cqh;
  border-radius: .2cqh;
  background: var(--accent);
}

.dt-next { display: flex; align-items: baseline; gap: 1.1em; min-width: 0; white-space: nowrap; }
.dt-next span:empty { display: none; }
.dt-next-label { letter-spacing: .2em; }
.dt-next-name { overflow: hidden; text-overflow: ellipsis; font-family: var(--font-title); color: var(--ink); }
.dt-next-time { font-family: var(--font-digits); font-variant-numeric: tabular-nums; color: var(--ink); }
.dt-halves[data-idle] ~ .dt-bottom .dt-next-name { color: var(--accent); }

/* ---- rings and toast ---- */

.dt-ring {
  position: absolute;
  width: 34cqh;
  height: 34cqh;
  margin: -17cqh 0 0 -17cqh;
  border: .45cqh solid var(--accent);
  border-radius: 50%;
  opacity: 0;
  animation: dt-ring 1100ms ease-out forwards;
}

.dt-toast {
  position: absolute;
  top: 0;
  left: 50%;
  max-width: 70cqw;
  padding: 1.3cqh 3.2cqh;
  border-bottom: .3cqh solid var(--accent);
  border-radius: 0 0 1.2cqh 1.2cqh;
  background: color-mix(in oklab, var(--ground) 94%, var(--ink));
  color: var(--ink);
  font-size: 2.4cqh;
  letter-spacing: .06em;
  white-space: nowrap;
  translate: -50% -110%;
  transition: translate 200ms var(--ease-out);
}
.dt-toast.is-shown { translate: -50% 0; }
.dt-toast:empty { visibility: hidden; }

/* ---- the one orchestrated moment: a new stage sweeps in from its side's seat ---- */

.dt-stage.is-entering .dt-field { animation: dt-sweep-l 560ms var(--ease-out); }
.dt-stage.is-entering[data-pro-seat="right"][data-side="pro"] .dt-field,
.dt-stage.is-entering[data-pro-seat="left"][data-side="con"] .dt-field { animation-name: dt-sweep-r; }
.dt-stage.is-entering .dt-half:first-child .dt-half-field { animation: dt-sweep-l 560ms var(--ease-out); }
.dt-stage.is-entering .dt-half:last-child .dt-half-field { animation: dt-sweep-r 560ms var(--ease-out); }
.dt-stage.is-entering .dt-title,
.dt-stage.is-entering .dt-card { animation: dt-rise 420ms var(--ease-out) both; }
.dt-stage.is-entering .dt-speaker,
.dt-stage.is-entering .dt-team { animation: dt-rise 420ms var(--ease-out) 70ms both; }
.dt-stage.is-entering .dt-clock { animation: dt-rise 420ms var(--ease-out) 140ms both; }

/* No `to` frame: the sweep ends on the field's live clip-path. */
@keyframes dt-sweep-l { from { clip-path: inset(0 100% 0 0); } }
@keyframes dt-sweep-r { from { clip-path: inset(0 0 0 100%); } }
@keyframes dt-rise { from { opacity: 0; transform: translateY(1.1cqh); } }
@keyframes dt-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
@keyframes dt-bump { from { transform: scale(1.07); } }
@keyframes dt-ring {
  from { transform: scale(.6); opacity: .9; }
  to { transform: scale(2.4); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .dt-stage, .dt-stage *, .dt-stage *::before, .dt-stage *::after {
    animation: none !important;
    transition: none !important;
  }
}

/* === styles/console.css === */
/* console.css: the timekeeper's layer over the stage: control dock, status pills, overlays (spec §5.7).
   Quiet surfaces in the theme's own colours, so the stage stays the only loud thing on screen. */

/* ---- shared surface ---- */

.dt-app {
  /* Chroma's dark plate when there is one, otherwise the ground lifted a little toward the ink. */
  --panel: var(--plate, color-mix(in oklab, var(--ground) 91%, var(--ink)));
  --panel-line: color-mix(in oklab, var(--ink) 15%, transparent);
  --panel-hover: color-mix(in oklab, var(--ink) 9%, transparent);
  --panel-shadow: 0 1.2em 3em rgb(0 0 0 / .32);
  --console-ease: cubic-bezier(.2, .8, .2, 1);
}

/* The root is the size container, so the layer is measured in the same cqh as the stage. */
.dt-dock, .dt-status, .dt-overlay {
  --ui: clamp(13px, 1.55cqh, 22px);
  font-family: var(--font-ui);
  font-size: var(--ui);
  line-height: 1.4;
  color: var(--ink);
  font-synthesis: none;
}

/* Zero specificity, so each component's own button rules win without !important. */
:where(.dt-dock, .dt-overlay) button {
  margin: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  cursor: pointer;
}
.dt-dock button:focus-visible, .dt-overlay button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.dt-dock button:disabled, .dt-overlay button:disabled { opacity: .34; cursor: default; }

.dt-dock kbd, .dt-overlay kbd {
  display: inline-block;
  min-width: 1.6em;
  padding: .08em .42em;
  border: 1px solid var(--panel-line);
  border-bottom-width: 2px;
  border-radius: .32em;
  font-family: var(--font-ui);
  font-size: .76em;
  line-height: 1.35;
  letter-spacing: 0;
  text-align: center;
  color: var(--ink-dim);
}

.dt-swatch {
  flex: none;
  width: .62em;
  height: .62em;
  border-radius: .12em;
  background: var(--pro);
}
.dt-swatch[data-side="con"] { background: var(--con); }

.dt-dock svg { flex: none; width: .8em; height: .8em; fill: currentColor; }
.dt-pill svg { flex: none; width: 1.15em; height: 1.15em; fill: currentColor; }

/* The pointer disappears from the projection with the dock; it comes back on the next movement. */
.dt-app[data-idle] .dt-stage { cursor: none; }

/* ---- dock: floats above the bottom bar, below the digits ---- */

.dt-dock {
  position: absolute;
  z-index: 20;
  left: 50%;
  bottom: 8.5cqh;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .3em;
  width: max-content;   /* shrink-to-fit would stop at the half width left of `left: 50%` */
  max-width: 90cqw;
  padding: .36em;
  border: 1px solid var(--panel-line);
  border-radius: .75em;
  background: var(--panel);
  box-shadow: var(--panel-shadow);
  letter-spacing: .06em;
  opacity: 0;
  translate: -50% .9em;
  pointer-events: none;
  transition: opacity 200ms var(--console-ease), translate 260ms var(--console-ease);
}
.dt-dock[data-shown] { opacity: 1; translate: -50% 0; pointer-events: auto; }
/* A pinned dock (a still for review) is simply there, with no entrance to catch half way. */
.dt-dock[data-pinned] { transition: none; }

.dt-dock-group { display: flex; gap: .15em; }
.dt-dock-group + .dt-dock-group { padding-left: .3em; border-left: 1px solid var(--panel-line); }

.dt-dock button {
  display: inline-flex;
  align-items: center;
  gap: .5em;
  padding: .55em .78em;
  border-radius: .5em;
  white-space: nowrap;
}
.dt-dock button:hover:not(:disabled) { background: var(--panel-hover); }
.dt-dock button[data-primary] {
  justify-content: center;
  min-width: 7.6em;
  background: color-mix(in oklab, var(--ink) 13%, transparent);
}
.dt-dock button[data-primary]:hover:not(:disabled) { background: color-mix(in oklab, var(--ink) 19%, transparent); }
.dt-dock .dt-icon { display: inline-flex; }

/* ---- status pills: top right, under the top bar ---- */

.dt-status {
  position: absolute;
  z-index: 15;
  top: 9cqh;
  right: 5cqw;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: .5em;
  font-size: clamp(12px, 1.4cqh, 20px);
  pointer-events: none;
}
.dt-pill {
  display: inline-flex;
  align-items: center;
  gap: .45em;
  padding: .38em .95em;
  border: 1px solid var(--panel-line);
  border-radius: 999px;
  background: var(--panel);
  color: var(--ink-dim);
  letter-spacing: .1em;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  transition: opacity 400ms ease, visibility 0s linear 400ms;
}
.dt-pill[data-shown] { opacity: 1; visibility: visible; transition: opacity 400ms ease; }
.dt-pill[data-kind="muted"] { order: -1; color: var(--accent); }

/* ---- overlays ---- */

.dt-overlay {
  position: absolute;
  z-index: 30;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.dt-scrim {
  position: absolute;
  inset: 0;
  background: color-mix(in oklab, var(--ground) 50%, transparent);
  animation: dt-fade 200ms ease both;
}

.dt-panel {
  position: relative;
  display: flex;
  flex-direction: column;
  width: min(44em, 90cqw);
  max-height: 86cqh;
  border: 1px solid var(--panel-line);
  border-radius: .8em;
  background: var(--panel);
  box-shadow: var(--panel-shadow);
  outline: none;
  animation: dt-panel-in 240ms var(--console-ease) both;
}
.dt-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2em;
  padding: 1em 1.1em .85em 1.5em;
  border-bottom: 1px solid var(--panel-line);
}
.dt-panel-head h2 {
  margin: 0;
  font-family: var(--font-title);
  font-size: 1.3em;
  font-weight: 600;
  letter-spacing: .14em;
}
.dt-close { padding: .3em; border-radius: .4em; }
.dt-close:hover kbd { color: var(--ink); }
.dt-panel-body { min-height: 0; overflow: auto; padding: .7em 1.5em 1.3em; }
.dt-panel-foot {
  display: flex;
  justify-content: flex-end;
  padding: .9em 1.5em 1.1em;
  border-top: 1px solid var(--panel-line);
}
.dt-button {
  padding: .5em 1.3em;
  border: 1px solid var(--panel-line);
  border-radius: .5em;
  letter-spacing: .1em;
}
.dt-button:hover { background: var(--panel-hover); }
.dt-hint { margin: 1.1em 0 0; font-size: .88em; letter-spacing: .06em; color: var(--ink-dim); }

/* Stage list: a drawer from the left; the stage stays in view beside it. */
.dt-overlay[data-name="stages"] { justify-content: flex-start; align-items: stretch; }
.dt-overlay[data-name="stages"] .dt-scrim { background: color-mix(in oklab, var(--ground) 28%, transparent); }
.dt-overlay[data-name="stages"] .dt-panel {
  width: min(30em, 46cqw);
  max-height: none;
  border-width: 0 1px 0 0;
  border-radius: 0;
  animation-name: dt-drawer-in;
}

.dt-stagelist { margin: 0 -.6em; padding: 0; list-style: none; }
.dt-row {
  display: grid;
  grid-template-columns: 1.6em .24em minmax(0, 1fr) auto 5.6em;
  align-items: center;
  gap: .75em;
  width: 100%;
  padding: .5em .6em;
  border-radius: .45em;
  text-align: left;
}
.dt-row[data-gap] { margin-top: .75em; }
.dt-row:hover { background: var(--panel-hover); }
.dt-row[aria-current] { background: color-mix(in oklab, var(--ink) 12%, transparent); }
.dt-row-index, .dt-row-plan, .dt-row-state {
  font-family: var(--font-digits);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--ink-dim);
}
.dt-row-index { text-align: right; }
.dt-row-side {
  align-self: stretch;
  border-radius: .12em;
  background: color-mix(in oklab, var(--ground) 50%, var(--ink));
}
.dt-row[data-side="pro"] .dt-row-side { background: var(--pro); }
.dt-row[data-side="con"] .dt-row-side { background: var(--con); }
.dt-row[data-kind="dual"] .dt-row-side { background: linear-gradient(var(--pro) 50%, var(--con) 50%); }
.dt-row-name { overflow: hidden; font-family: var(--font-title); white-space: nowrap; text-overflow: ellipsis; }
.dt-row-state { text-align: right; }
.dt-row[aria-current] .dt-row-state, .dt-row[data-over] .dt-row-state { color: var(--accent); }

/* Help: the key table. */
.dt-keys { width: 100%; border-collapse: collapse; }
.dt-keys th, .dt-keys td { padding: .42em 0; vertical-align: baseline; text-align: left; }
.dt-keys tr + tr > * { border-top: 1px solid var(--panel-line); }
.dt-keys th { padding-right: 1.8em; font-weight: normal; white-space: nowrap; }
.dt-keys kbd { color: var(--ink); }
.dt-keys kbd + kbd { margin-left: .45em; }

/* Insert: one row per variant, a button per side. */
.dt-extra h3 {
  margin: .5em 0 .5em;
  font-family: var(--font-title);
  font-size: 1.1em;
  font-weight: 600;
  letter-spacing: .12em;
}
.dt-extra h3 small, .dt-extra-name small {
  margin-left: .9em;
  font-family: var(--font-ui);
  font-size: .76em;
  font-weight: normal;
  letter-spacing: .06em;
  color: var(--ink-dim);
}
.dt-extra-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto auto;
  align-items: center;
  gap: .8em;
  padding: .75em 0;
  border-top: 1px solid var(--panel-line);
}
.dt-extra-name { font-family: var(--font-title); }
.dt-extra-name small { display: block; margin: .2em 0 0; }
.dt-extra-time { font-family: var(--font-digits); font-variant-numeric: tabular-nums; color: var(--ink-dim); }
.dt-extra-side {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5em;
  min-width: 6.8em;
  padding: .5em 1em;
  border: 1px solid var(--panel-line);
  border-radius: .5em;
  letter-spacing: .1em;
}
.dt-extra-side:hover:not(:disabled) { background: var(--panel-hover); }

/* Record: the same table as the end card, with the overtime column. */
.dt-record-table { width: 100%; border-collapse: collapse; }
.dt-record-table th, .dt-record-table td { padding: .32em 1.6em .32em 0; text-align: left; white-space: nowrap; }
.dt-record-table th {
  position: sticky;
  top: -.7em;
  padding-top: .7em;
  border-bottom: 1px solid var(--panel-line);
  background: var(--panel);
  font-weight: normal;
  letter-spacing: .2em;
  color: var(--ink-dim);
}
.dt-record-table td:first-child { max-width: 24em; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-title); }
.dt-record-table td:first-child::before {
  content: "";
  display: inline-block;
  width: .5em;
  height: .5em;
  margin-right: .8em;
  vertical-align: .12em;
  background: color-mix(in oklab, var(--ground) 50%, var(--ink));
}
.dt-record-table tr[data-side="pro"] td:first-child::before { background: var(--pro); }
.dt-record-table tr[data-side="con"] td:first-child::before { background: var(--con); }
.dt-record-table td:not(:first-child) { font-family: var(--font-digits); font-variant-numeric: tabular-nums; }
.dt-record-table tr[data-over] td:nth-child(n+3) { color: var(--accent); }
.dt-record-table tr[data-current] td { background: var(--panel-hover); }

/* The copy fallback's textarea, off screen. */
.dt-offscreen { position: fixed; left: -9999px; top: 0; opacity: 0; }

@keyframes dt-fade { from { opacity: 0; } }
@keyframes dt-panel-in { from { opacity: 0; transform: translateY(1.2cqh); } }
@keyframes dt-drawer-in { from { transform: translateX(-100%); } }

@media (prefers-reduced-motion: reduce) {
  .dt-dock, .dt-pill, .dt-overlay, .dt-overlay * {
    animation: none !important;
    transition: none !important;
  }
}

/* === themes/chroma.css === */
/* @theme id=chroma name=绿幕 desc=纯绿底，数字放在本方色底板上，供直播抠像 */
/* 绿幕: for keying. Flat #00B140 everywhere, no field and no background motion; content sits on plates. */
[data-theme="chroma"] {
  --pro: #B8322A;
  --pro-deep: #00B140;
  --con: #1D4E89;
  --con-deep: #00B140;
  --ground: #00B140;
  --ink: #F4EFE4;
  --ink-dim: #D8D2C6;       /* solid: translucent text would pick up the key colour */
  --accent: #E4B04A;
  --font-digits: "Bahnschrift", "DIN Alternate", "Segoe UI", sans-serif;
  --font-title: "Noto Serif SC", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
  --font-ui: "Microsoft YaHei UI", "Microsoft YaHei", "DengXian", system-ui, sans-serif;
  --backdrop: none;
  --plate: #2A2D33;
  --plate-radius: 2cqh;
}
.dt-stage[data-theme="chroma"][data-side="none"] { --side-color: var(--plate); }

.dt-stage[data-theme="chroma"] .dt-field,
.dt-stage[data-theme="chroma"] .dt-warnline,
.dt-stage[data-theme="chroma"] .dt-half-field,
.dt-stage[data-theme="chroma"] .dt-bottom::before { display: none; }
.dt-stage[data-theme="chroma"] .dt-half { box-shadow: none; }
.dt-stage[data-theme="chroma"] .dt-halves:not([data-idle]) .dt-half:not([data-active]) { filter: none; }

/* Plates: the head and the cards are solid; the digits' plate narrows with the time left over a dark track,
   so the digits always sit on something solid. */
.dt-stage[data-theme="chroma"] .dt-head,
.dt-stage[data-theme="chroma"] .dt-card,
.dt-stage[data-theme="chroma"] .dt-top,
.dt-stage[data-theme="chroma"] .dt-bottom {
  border-radius: var(--plate-radius);
  background: var(--plate);
}
.dt-stage[data-theme="chroma"] .dt-head { align-self: flex-start; padding: 1.6cqh 2.6cqh; background: var(--side-color); }
.dt-stage[data-theme="chroma"][data-kind="dual"] .dt-head { margin-top: 8.5cqh; background: var(--plate); }
.dt-stage[data-theme="chroma"] .dt-card { padding: 3cqh 4cqh; }
.dt-stage[data-theme="chroma"] .dt-top { align-self: stretch; padding: .8cqh 2cqh; }
.dt-stage[data-theme="chroma"] .dt-bottom { padding: 1.4cqh 2cqh; }

.dt-stage[data-theme="chroma"] .dt-clock::before,
.dt-stage[data-theme="chroma"] .dt-clock::after {
  content: "";
  position: absolute;
  z-index: -1;
  inset: -2cqh -4cqh;
  border-radius: var(--plate-radius);
  background: var(--side-color);
  clip-path: inset(0 calc(var(--used) * 100%) 0 0 round var(--plate-radius));
}
.dt-stage[data-theme="chroma"] .dt-clock::after { z-index: -2; background: var(--plate); clip-path: none; }
.dt-stage[data-theme="chroma"][data-pro-seat="right"][data-side="pro"] .dt-clock[data-clock="main"]::before,
.dt-stage[data-theme="chroma"][data-pro-seat="left"][data-side="con"] .dt-clock[data-clock="main"]::before {
  clip-path: inset(0 0 0 calc(var(--used) * 100%) round var(--plate-radius));
}
.dt-stage[data-theme="chroma"] .dt-half .dt-clock::before {
  clip-path: inset(0 calc((1 - var(--remain, 1)) * 100%) 0 0 round var(--plate-radius));
}
.dt-stage[data-theme="chroma"] .dt-half:last-child .dt-clock::before {
  clip-path: inset(0 0 0 calc((1 - var(--remain, 1)) * 100%) round var(--plate-radius));
}
.dt-stage[data-theme="chroma"] .dt-halves:not([data-idle]) .dt-half:not([data-active]) .dt-clock::before {
  background: color-mix(in oklab, var(--side-color) 55%, var(--plate));
}
.dt-stage[data-theme="chroma"] .dt-half[data-locked] .dt-clock::before { clip-path: none; background: var(--plate); }
.dt-stage[data-theme="chroma"] .dt-team {
  right: auto;
  max-width: calc(100% - 10cqw);
  padding: .9cqh 2cqh;
  border-radius: var(--plate-radius);
  background: var(--plate);
  color: var(--ink);
}
.dt-stage[data-theme="chroma"] .dt-half:last-child .dt-team { left: auto; right: 5cqw; }
/* Neutral segments mix with the plate, not the green ground, so nothing on screen carries the key colour. */
.dt-stage[data-theme="chroma"] .dt-seg[data-side="none"] { --seg: color-mix(in oklab, var(--plate) 45%, var(--ink)); }

/* === themes/daylight.css === */
/* @theme id=daylight name=昼 desc=浅色底，色场收成数字后的一条横带，适合亮场投影 */
/* 昼: for lit rooms. The field is a 34cqh band behind the digits instead of the whole screen (spec §5.6). */
[data-theme="daylight"] {
  --pro: #B3261E;
  --pro-deep: #6A1611;
  --con: #1A4E8F;
  --con-deep: #0F2E55;
  --ground: #E7E9EC;
  --ink: #15171B;
  --ink-dim: rgb(21 23 27 / .58);
  --accent: #B7791F;
  --on-side: #F7F4EE;
  --font-digits: "Bahnschrift", "DIN Alternate", "Segoe UI", sans-serif;
  --font-title: "Noto Serif SC", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
  --font-ui: "Microsoft YaHei UI", "Microsoft YaHei", "DengXian", system-ui, sans-serif;
  --backdrop: none;
  --band: 34cqh;
}

.dt-stage[data-theme="daylight"] { background: var(--ground); }
.dt-stage[data-theme="daylight"] .dt-bottom::before { display: none; }

/* The band and its deep track sit on the digits' centre line; the band is taken back the same way. */
.dt-stage[data-theme="daylight"] .dt-field,
.dt-stage[data-theme="daylight"] .dt-warnline,
.dt-stage[data-theme="daylight"][data-mode="stage"][data-kind="single"] .dt-deco {
  top: var(--clock-y);
  bottom: auto;
  height: var(--band);
  translate: 0 -50%;
}
.dt-stage[data-theme="daylight"][data-mode="stage"][data-kind="single"] .dt-deco { background: var(--side-deep); }
.dt-stage[data-theme="daylight"][data-kind="break"] .dt-field { display: none; }
.dt-stage[data-theme="daylight"] .dt-warnline { -webkit-mask-image: none; mask-image: none; }

/* Dual: each half keeps the light ground, with its band draining from the top inside the track. */
.dt-stage[data-theme="daylight"] .dt-half { background: var(--ground); }
.dt-stage[data-theme="daylight"] .dt-half::before {
  content: "";
  position: absolute;
  inset: 52% 0 auto;
  height: var(--band);
  translate: 0 -50%;
  background: var(--side-deep);
}
.dt-stage[data-theme="daylight"] .dt-half-field {
  bottom: calc(48% - var(--band) / 2);
  height: calc(var(--remain, 1) * var(--band));
}
.dt-stage[data-theme="daylight"] .dt-team { color: var(--ink); }
/* Dim only the band and digits of the waiting side; a dimmed light ground would read as a grey slab. */
.dt-stage[data-theme="daylight"] .dt-halves:not([data-idle]) .dt-half:not([data-active]) { filter: none; }
.dt-stage[data-theme="daylight"] .dt-halves:not([data-idle]) .dt-half:not([data-active])::before,
.dt-stage[data-theme="daylight"] .dt-halves:not([data-idle]) .dt-half:not([data-active]) .dt-half-field,
.dt-stage[data-theme="daylight"] .dt-halves:not([data-idle]) .dt-half:not([data-active]) .dt-clock {
  filter: saturate(.45) brightness(.78);
}
.dt-stage[data-theme="daylight"] .dt-half + .dt-half { box-shadow: inset 1px 0 0 color-mix(in oklab, var(--ink) 14%, transparent); }

/* === themes/hall.css === */
/* @theme id=hall name=堂 desc=全屏色场，适合暗场投影 */
/* 堂: the default. The whole room takes the speaking side's colour (spec §5.2). */
[data-theme="hall"] {
  --pro: #B8322A;
  --pro-deep: #521511;
  --con: #1D4E89;
  --con-deep: #0C2340;
  --ground: #2A2D33;
  --ink: #F4EFE4;
  --ink-dim: rgb(244 239 228 / .6);
  --accent: #E4B04A;
  --font-digits: "Bahnschrift", "DIN Alternate", "Segoe UI", sans-serif;
  --font-title: "Noto Serif SC", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
  --font-ui: "Microsoft YaHei UI", "Microsoft YaHei", "DengXian", system-ui, sans-serif;
  --backdrop: none;
}

/* Light falls from above onto the field, so a projected flat colour still reads as a room. */
.dt-stage[data-theme="hall"] .dt-field,
.dt-stage[data-theme="hall"] .dt-half-field {
  background-image: linear-gradient(to bottom, rgb(255 255 255 / .07), transparent 40%, rgb(0 0 0 / .16));
}

/* A soft vignette on the deep ground that the field gives back. */
.dt-stage[data-theme="hall"] .dt-deco {
  background: radial-gradient(130% 95% at 50% 42%, transparent 52%, rgb(0 0 0 / .3));
}

.dt-stage[data-theme="hall"] .dt-digits { text-shadow: 0 .015em .06em rgb(0 0 0 / .2); }

</style>

    if (route.name === 'demo') {
      DT.store.useStorage(memoryStorage());
      const now = DT.clock.now();
      if (route.frozen) DT.clock.set(() => now);
      demo = DT.demo.build(route.demo, now);
      session = demo.session;
    } else {
      if (o.storage) DT.store.useStorage(o.storage);
      const now = DT.clock.now();
      session = resumable(DT.store.loadSession(), now) || newSession(o, now);
    }
    const still = route.name === 'demo' && route.frozen;   // a screenshot: no sound hint
    const settings = DT.store.loadSettings();
    bells.setVolume(settings.volume);
    bells.setMuted(settings.muted);

    root.classList.add('dt-app');
    const stage = DT.render.mount(root);
    const dock = el('div', 'dt-dock');
    attr(dock, 'role', 'group');   // not a toolbar: the arrow keys belong to the timer
    attr(dock, 'aria-label', '计时控制');
    dock.innerHTML = DOCK;
    const status = el('div', 'dt-status');
    status.innerHTML = STATUS;
    root.appendChild(dock);
    root.appendChild(status);
    const dockBtn = sel => dock.querySelector('button[data-act="' + sel + '"]');
    const btn = {
      prev: dockBtn('prev'), next: dockBtn('next'), toggle: dockBtn('toggle'),
      pro: dock.querySelector('button[data-side="pro"]'), con: dock.querySelector('button[data-side="con"]'),
      undo: dockBtn('undo'), insert: dockBtn('insert'),
    };
    const toggleIcon = btn.toggle.querySelector('.dt-icon');
    const toggleLabel = btn.toggle.querySelector('.dt-toggle-label');
    const pills = { sound: status.querySelector('[data-kind="sound"]'), muted: status.querySelector('[data-kind="muted"]') };

    const listeners = { change: [], events: [] };
    let raf = null, destroyed = false, overlay = null, armed = null, dockTimer = null, dockPinned = false;

    function emit(name, arg) { listeners[name].slice().forEach(fn => fn(arg)); }

    function viewAt(now) {
      const v = DT.engine.view(session, now);
      if (v.mode === 'end') v.record = DT.engine.record(session, now);
      return v;
    }

    function pulse(events) {
      if (!events.length) return;
      events.forEach(e => stage.pulse(e));
      emit('events', events);
    }

    // ---- painting: stage, dock, status pills, the open overlay ----

    function paintDock(v) {
      const st = v.stage;
      const run = st ? DT.engine.getRun(session) : null;
      const dual = !!st && st.type === 'dual';
      btn.prev.disabled = session.cursor < 0;
      btn.next.disabled = session.cursor >= session.timeline.length;
      btn.toggle.disabled = v.mode === 'end' || !!(run && run.done);
      const started = v.clocks.some(c => c.remaining !== c.total);
      const label = v.running ? (dual ? '换边' : '暂停') : started ? '继续' : '开始';
      text(toggleLabel, label);
      const icon = v.running && !dual ? 'pause' : 'play';
      if (toggleIcon.dataset.icon !== icon) { toggleIcon.dataset.icon = icon; toggleIcon.innerHTML = ICON[icon]; }
      ['pro', 'con'].forEach(side => {
        const clock = v.clocks.find(c => c.id === side);
        btn[side].disabled = !dual || !!(clock && clock.locked);
      });
      btn.undo.disabled = !(session.history && session.history.length);
      btn.insert.disabled = !v.extras.length;
    }

    function paintStatus() {
      attr(pills.sound, 'data-shown', !still && !bells.isUnlocked());
      attr(pills.muted, 'data-shown', !!settings.muted);
    }

    function paint(now) {
      const v = viewAt(now);
      stage.update(v);
      attr(root, 'data-theme', stage.el.getAttribute('data-theme'));
      paintDock(v);
      if (overlay) overlay.refresh(now, v);
    }

    // ---- actions ----

    // Every session action ticks first: a dual side that ran out must be locked before the action applies.
    function apply(fn, args) {
      const now = DT.clock.now();
      const out = DT.engine.tick(session, now);
      pulse(out.events);
      session = fn.apply(null, [out.session, now].concat(args));
      DT.store.saveSession(session);
      bells.schedule(DT.engine.upcomingBells(session, now), now);
      if (session.lastFeedback) stage.toast(session.lastFeedback.message);
      emit('change', session);
      paint(now);
    }

    function fullscreen() {
      try {
        const p = document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen();
        if (p && p.catch) p.catch(() => {});
      } catch (e) { /* fullscreen not allowed here */ }
    }

    function toggleMute() {
      settings.muted = !settings.muted;
      bells.setMuted(settings.muted);
      DT.store.saveSettings(settings);
      paintStatus();
    }

    const OTHER_ACTS = { bell: () => bells.play('ding'), mute: toggleMute, fullscreen };

    function act(name) {
      if (destroyed) return false;
      const args = Array.prototype.slice.call(arguments, 1);
      if (SESSION_ACTS[name]) apply(SESSION_ACTS[name], args);
      else if (OTHER_ACTS[name]) OTHER_ACTS[name]();
      else return false;
      return true;
    }

    // ---- keys ----

    // The one entry for keys, from this window's keydown or forwarded from elsewhere. Returns true when handled.
    function key(code, opts) {
      const k = opts || {};
      if (destroyed || k.altKey || k.metaKey || (k.ctrlKey && code !== 'KeyZ')) return false;
      const cmd = command(code, !!k.shiftKey);
      if (!cmd) return false;
      if (k.repeat && !cmd.hold) return true;   // swallowed, so a held space neither repeats nor scrolls
      if (cmd.close) {
        if (!overlay) return false;
        closeOverlay();
        return true;
      }
      if (cmd.twice) {
        const now = DT.clock.now();
        if (armed && armed.code === code && now - armed.at <= DOUBLE_MS) {
          armed = null;
          act.apply(null, cmd.act);
        } else {
          armed = { code, at: now };
          stage.toast(cmd.twice);
        }
        return true;
      }
      armed = null;
      if (cmd.overlay) {
        if (overlay && overlay.name === cmd.overlay) closeOverlay();
        else openOverlay(cmd.overlay);
        return true;
      }
      act.apply(null, cmd.act);
      return true;
    }

    // ---- overlays ----

    function stagesOverlay(body) {
      const list = el('ol', 'dt-stagelist');
      body.appendChild(list);
      let sig = null, rows = [];
      return function refresh(now, v) {
        const tl = session.timeline;
        const s = tl.map(x => x.id + ',' + x.name).join('|');
        if (s !== sig) {
          sig = s;
          list.textContent = '';
          rows = tl.map((st, i) => {
            const li = el('li');
            const b = el('button', 'dt-row');
            b.type = 'button';
            attr(b, 'data-index', i);
            attr(b, 'data-side', st.side || 'none');
            attr(b, 'data-kind', st.type);
            attr(b, 'data-gap', i > 0 && (st.block || '') !== (tl[i - 1].block || ''));
            const state = el('span', 'dt-row-state');
            [el('span', 'dt-row-index', String(i + 1)), el('i', 'dt-row-side'), el('span', 'dt-row-name', st.name),
              el('span', 'dt-row-plan', planned(st)), state].forEach(c => b.appendChild(c));
            b.addEventListener('click', () => { act('goto', i); closeOverlay(); });
            li.appendChild(b);
            list.appendChild(li);
            return { b, state };
          });
        }
        const rec = DT.engine.record(session, now);
        const active = v.clocks.find(c => c.active) || v.clocks[0];
        rows.forEach((r, i) => {
          const cur = i === session.cursor;
          attr(r.b, 'aria-current', cur ? 'step' : null);
          attr(r.b, 'data-over', !cur && rec[i].over >= 1000);
          let s = '';
          if (cur) s = '● ' + (active ? active.text : '');
          else if (rec[i].over >= 1000) s = '+' + duration(rec[i].over);
          else if (rec[i].used > 0) s = '✓ ' + duration(rec[i].used);
          text(r.state, s);
        });
      };
    }

    function helpOverlay(body) {
      const table = el('table', 'dt-keys');
      HELP.forEach(([keys, what]) => {
        const tr = el('tr');
        const th = el('th');
        keys.forEach(k => th.appendChild(el('kbd', null, k)));
        tr.appendChild(th);
        tr.appendChild(el('td', null, what));
        table.appendChild(tr);
      });
      body.appendChild(table);
      return () => {};
    }

    function insertOverlay(body) {
      let sig = null;
      return function refresh(now, v) {
        const s = JSON.stringify(v.extras);
        if (s === sig) return;
        sig = s;
        body.textContent = '';
        v.extras.forEach(g => {
          const sec = el('section', 'dt-extra');
          const h = el('h3', null, g.group);
          h.appendChild(el('small', null, '每方 ' + g.perSide + ' 次'));
          sec.appendChild(h);
          g.variants.forEach((variant, k) => {
            const row = el('div', 'dt-extra-row');
            const name = el('div', 'dt-extra-name', variant.name);
            if (variant.note) name.appendChild(el('small', null, variant.note));
            row.appendChild(name);
            row.appendChild(el('span', 'dt-extra-time', DT.engine.fmt(variant.secs * 1000)));
            ['pro', 'con'].forEach(side => {
              const used = g.used[side] >= g.perSide;
              const b = el('button', 'dt-extra-side');
              b.type = 'button';
              b.dataset.group = g.group;
              b.dataset.variant = String(k);
              b.dataset.side = side;
              b.disabled = used;
              b.appendChild(el('i', 'dt-swatch'));
              b.lastChild.dataset.side = side;
              b.appendChild(el('span', null, SIDE_NAME[side] + (used ? ' 已用' : '')));
              b.addEventListener('click', () => {
                act('insert', g.group, k, side);
                if (!session.lastFeedback) closeOverlay();
              });
              row.appendChild(b);
            });
            sec.appendChild(row);
          });
          body.appendChild(sec);
        });
        body.appendChild(el('p', 'dt-hint', '插在当前环节之后，按 → 进入'));
      };
    }

    function copyText(value) {
      const fallback = () => {
        const ta = el('textarea');
        ta.value = value;
        ta.setAttribute('readonly', '');
        ta.className = 'dt-offscreen';
        root.appendChild(ta);
        ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        ta.remove();
        stage.toast(ok ? '已复制' : '没能复制，请手动选中表格复制');
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(value).then(() => stage.toast('已复制'), fallback);
          return;
        }
      } catch (e) { /* fall back below */ }
      fallback();
    }

    function recordOverlay(body) {
      const table = el('table', 'dt-record-table');
      const foot = el('div', 'dt-panel-foot');
      const copy = el('button', 'dt-button', '复制为文本');
      copy.type = 'button';
      copy.dataset.action = 'copy';
      copy.addEventListener('click', () => copyText(recordText(DT.engine.record(session, DT.clock.now()))));
      foot.appendChild(copy);
      body.appendChild(table);
      body.parentNode.appendChild(foot);   // below the scrolling body, always in view
      let sig = null, cells = [];
      return function refresh(now) {
        const rec = DT.engine.record(session, now);
        const s = rec.map(r => r.name).join('|');
        if (s !== sig) {
          sig = s;
          table.textContent = '';
          const head = el('tr');
          ['环节', '计划', '实际', '超时'].forEach(h => head.appendChild(el('th', null, h)));
          table.appendChild(head);
          cells = rec.map(r => {
            const tr = el('tr');
            attr(tr, 'data-side', r.side || 'none');
            const tds = [0, 1, 2, 3].map(() => tr.appendChild(el('td')));
            table.appendChild(tr);
            return { tr, tds };
          });
        }
        rec.forEach((r, i) => {
          const c = cells[i];
          text(c.tds[0], r.name);
          text(c.tds[1], DT.engine.fmt(r.planned));
          text(c.tds[2], r.used > 0 ? duration(r.used) : '—');
          text(c.tds[3], r.over >= 1000 ? '+' + duration(r.over) : '');
          attr(c.tr, 'data-over', r.over >= 1000);
          attr(c.tr, 'data-current', i === session.cursor);
        });
      };
    }

    const OVERLAYS = { stages: stagesOverlay, help: helpOverlay, insert: insertOverlay, record: recordOverlay };

    function openOverlay(name) {
      if (destroyed || !OVERLAYS[name]) return false;
      if (name === 'insert' && !(session.format.extras || []).length) {
        stage.toast('这个赛制没有可插入的环节');
        return false;
      }
      closeOverlay();
      const wrap = el('div', 'dt-overlay');
      wrap.dataset.name = name;
      wrap.innerHTML = PANEL;
      const panel = wrap.querySelector('.dt-panel');
      attr(panel, 'aria-label', OVERLAY_TITLE[name]);
      text(wrap.querySelector('h2'), OVERLAY_TITLE[name]);
      wrap.querySelector('.dt-scrim').addEventListener('click', closeOverlay);
      wrap.querySelector('.dt-close').addEventListener('click', closeOverlay);
      overlay = { name, el: wrap, refresh: OVERLAYS[name](wrap.querySelector('.dt-panel-body')) };
      root.appendChild(wrap);
      const now = DT.clock.now();
      overlay.refresh(now, viewAt(now));
      try { panel.focus({ preventScroll: true }); } catch (e) { /* focus is a nicety */ }
      return true;
    }

    function closeOverlay() {
      if (!overlay) return;
      overlay.el.remove();
      overlay = null;
    }

    // ---- dock: shown on pointer movement or keyboard focus, folded away when idle ----

    function showDock() {
      attr(dock, 'data-shown', true);
      attr(root, 'data-idle', false);
      clearTimeout(dockTimer);
      dockTimer = setTimeout(hideDock, DOCK_IDLE_MS);
    }

    function hideDock() {
      dockTimer = null;
      if (dockPinned || dock.contains(document.activeElement)) return;   // focusout restarts the timer
      if (dock.matches(':hover')) { dockTimer = setTimeout(hideDock, DOCK_IDLE_MS); return; }
      attr(dock, 'data-shown', false);
      attr(root, 'data-idle', true);
    }

    const DOCK_ACTS = {
      prev: () => act('prev'), next: () => act('next'), toggle: () => act('toggle'), undo: () => act('undo'),
      insert: () => openOverlay('insert'), stages: () => openOverlay('stages'), fullscreen: () => act('fullscreen'),
    };
    dock.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b || b.disabled) return;
      if (b.dataset.act === 'floor') act('floor', b.dataset.side);
      else if (DOCK_ACTS[b.dataset.act]) DOCK_ACTS[b.dataset.act]();
    });
    // A mouse click must not leave focus on a button, or the next space would press it as well as toggle.
    dock.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
    dock.addEventListener('focusin', showDock);
    dock.addEventListener('focusout', showDock);

    // ---- window listeners ----

    // The first gesture unlocks audio; until then a pill asks for a key.
    function gesture() {
      if (bells.isUnlocked()) return;
      bells.unlock();
      paintStatus();
    }

    function onKeyDown(e) {
      gesture();
      if (isEditable(e.target)) return;
      if (e.isComposing) return;
      if (key(e.code, e)) e.preventDefault();
    }

    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('pointerdown', gesture);
    window.addEventListener('pointermove', showDock);

    // ---- frame loop ----

    // One frame: apply the automatic rules, keep what changed, play their visual events, repaint.
    function frame() {
      const now = DT.clock.now();
      const out = DT.engine.tick(session, now);
      if (out.session !== session) {
        session = out.session;
        DT.store.saveSession(session);
        emit('change', session);
      }
      pulse(out.events);
      paint(now);
      raf = requestAnimationFrame(frame);
    }
    frame();
    const bootNow = DT.clock.now();
    bells.schedule(DT.engine.upcomingBells(session, bootNow), bootNow);   // a resumed clock rings on time
    paintStatus();
    if (demo && demo.dock) {
      dockPinned = true;
      attr(dock, 'data-pinned', true);
      showDock();
    }

    return {
      session: () => session,
      view: () => viewAt(DT.clock.now()),
      key, act, openOverlay, closeOverlay,
      on(name, fn) {
        listeners[name].push(fn);
        return () => { listeners[name] = listeners[name].filter(f => f !== fn); };
      },
      destroy() {
        if (destroyed) return;
        destroyed = true;
        cancelAnimationFrame(raf);
        clearTimeout(dockTimer);
        window.removeEventListener('keydown', onKeyDown);
        window.removeEventListener('pointerdown', gesture);
        window.removeEventListener('pointermove', showDock);
        bells.cancelAll();
        closeOverlay();
        dock.remove();
        status.remove();
        stage.destroy();
        root.classList.remove('dt-app');
        ['data-theme', 'data-idle'].forEach(a => root.removeAttribute(a));
        listeners.change = [];
        listeners.events = [];
      },
    };
  }

  function autoboot() {
    if (document.body.hasAttribute('data-dt-autoboot')) boot({ root: document.getElementById('app') });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', autoboot);
  else autoboot();

  DT.app = { boot };
})(window.DT = window.DT || {});

</script>
</body>
</html>
