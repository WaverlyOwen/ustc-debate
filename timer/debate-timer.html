<html lang="zh-CN">
<head>

<style id="dt-style">
/* === styles/base.css === */
/* base.css: the theme variable contract with 堂 (hall) defaults, a small reset, and the stage's size basis. */

/* The digits' face. Edge loads the system Bahnschrift as a set of named faces and then ignores
   font-variation-settings on it, so the digits never tense up. Declared here with its axis ranges, the same
   font varies continuously in weight and width (spec §5.3). Every theme's --font-digits leads with it. */
@font-face {
  font-family: "DT Digits";
  src: local("Bahnschrift");
  font-weight: 300 700;
  font-stretch: 75% 100%;
}

/* The contract every theme defines (spec §5.6). These defaults are hall's values. */
:root {
  --pro: #B8322A;
  --pro-deep: #521511;
  --con: #1D4E89;
  --con-deep: #0C2340;
  --ground: #2A2D33;
  --ink: #F4EFE4;
  --ink-dim: rgb(244 239 228 / .6);
  --accent: #E4B04A;
  --font-digits: "DT Digits", "Bahnschrift", "DIN Alternate", "Segoe UI", sans-serif;
  --font-title: "Noto Serif SC", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
  --font-ui: "Microsoft YaHei UI", "Microsoft YaHei", "DengXian", system-ui, sans-serif;
  --backdrop: none;
}

*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-ui);
}

/* The host decides the size; everything on the stage is sized in container units (cqh / cqw),
   so a shrunken preview on the console and the full-screen projection keep the same proportions. */
.dt-stage-host {
  container-type: size;
  position: relative;
  overflow: hidden;
}

.dt-stage {
  position: absolute;
  inset: 0;
  /* Optional contract extras with derived defaults; a theme may override them. */
  --on-side: var(--ink);        /* text drawn on a side colour (team names, 「暂停」) */
  --digits-on-field: var(--ink);    /* the digits where they sit on the speaking side's field */
  --digits-off-field: var(--ink);   /* the digits where the field has been taken back (spec §1.5) */
  --speaker-ink: var(--ink);        /* the speaker line: set apart by size and spacing, not transparency */
  --text-field: var(--side-color);  /* the two grounds the top bar, stage name and speaker can sit on: a theme */
  --text-deep: var(--side-deep);    /* whose field never reaches them points these at what does (spec §1.5) */
  --used: 0;
  --tension: 0;
  --warn-at: 0;
}

.dt-stage [hidden] { display: none !important; }

/* The page shell ui.js mounts into fills the window. */
.dt-app { height: 100%; }

/* === styles/stage.css === */
/* stage.css: the projected stage (spec §5.3–5.5). Colours and fonts come only from the theme variables. */

/* ---- frame ---- */

/* Registered so they can be transitioned. --dim (0 speaking, 1 waiting) eases a free-debate half down with the switch,
   for themes that dim by colour or opacity rather than by the filter. --remain is a half's time left (render.js); it
   eases only into a lock, so a yielded half drains instead of emptying in one frame. */
@property --dim { syntax: "<number>"; inherits: true; initial-value: 0; }
@property --remain { syntax: "<number>"; inherits: true; initial-value: 1; }

.dt-stage {
  --side-color: color-mix(in oklab, var(--ground) 90%, var(--ink));
  --side-deep: var(--ground);
  --clock-y: 55%;                 /* vertical centre of the main digits */
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-spring: cubic-bezier(.34, 1.36, .64, 1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  isolation: isolate;
  padding: 4.2cqh 5cqw 3.6cqh;
  background: var(--side-deep);
  color: var(--ink);
  font-family: var(--font-ui);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
.dt-stage[data-side="pro"] { --side-color: var(--pro); --side-deep: var(--pro-deep); }
.dt-stage[data-side="con"] { --side-color: var(--con); --side-deep: var(--con-deep); }

/* ---- layers, bottom to top (spec §1.5): backdrop, canvas, deco, field / halves, deco-over, warn line, content,
   toast. A bell's ring is drawn inside the clock that rang, under its digits (see "rings and toast"). ---- */

.dt-backdrop, .dt-canvas, .dt-deco, .dt-field, .dt-halves, .dt-deco-over, .dt-warnline {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.dt-backdrop { z-index: 0; background: var(--backdrop); }
/* A theme painter's canvas (only when the theme has one); it comes before the deco, so the deco paints over it. */
.dt-canvas { z-index: 1; width: 100%; height: 100%; }
.dt-deco { z-index: 1; }                /* decoration under the field (daylight's band track) */
.dt-field, .dt-halves { z-index: 2; }
.dt-deco-over { z-index: 3; }           /* decoration over the field and the halves: seals, marks, grain */
.dt-warnline { z-index: 4; }
.dt-top, .dt-head, .dt-clock, .dt-card, .dt-bottom { position: relative; z-index: 5; }
.dt-toast { z-index: 7; }

/* The colour field: time is taken back toward the speaking side's own seat. */
.dt-field {
  background: var(--side-color);
  clip-path: inset(0 calc(var(--used) * 100%) 0 0);
}
.dt-stage[data-pro-seat="right"][data-side="pro"] .dt-field,
.dt-stage[data-pro-seat="left"][data-side="con"] .dt-field {
  clip-path: inset(0 0 0 calc(var(--used) * 100%));
}
/* A break is the plain ground (spec §5.4): a receding field's edge would cut through its centred text. */
.dt-stage:not([data-mode="stage"]) .dt-field,
.dt-stage[data-kind="dual"] .dt-field,
.dt-stage[data-kind="break"] .dt-field { display: none; }

/* A gold hairline where the warn bell sits, visible until the field has been taken back past it. */
.dt-warnline {
  right: auto;
  left: calc(var(--warn-at) * 100%);
  width: 2px;
  margin-left: -1px;
  background: var(--accent);
  /* Kept to the field's clear zone: absent where the stage name and speaker sit, faint behind the digits,
     full strength below them, gone again before the bottom bar and its 下一环节, then a short full-strength
     tick at the very floor under the bar, so the 30-second point still reads from the back of the room. */
  --warn-mask: linear-gradient(to bottom, transparent 0 30cqh, rgb(0 0 0 / .2) 34cqh 74cqh, #000 80cqh 86cqh,
    transparent 90cqh calc(100% - 1.6cqh), #000 calc(100% - 1.6cqh));
  -webkit-mask-image: var(--warn-mask);
  mask-image: var(--warn-mask);
  transition: opacity 400ms ease;
}
.dt-stage[data-pro-seat="right"][data-side="pro"] .dt-warnline,
.dt-stage[data-pro-seat="left"][data-side="con"] .dt-warnline {
  left: calc((1 - var(--warn-at)) * 100%);
}
.dt-stage:not([data-mode="stage"]) .dt-warnline,
.dt-stage:not([data-kind="single"]) .dt-warnline { display: none; }
.dt-stage:not([data-phase="calm"]) .dt-warnline { opacity: 0; }

/* ---- top bar ---- */

.dt-top {
  display: flex;
  justify-content: space-between;
  gap: 4cqw;
  min-height: 1.4em;
  font-size: 2cqh;
  letter-spacing: .08em;
  color: var(--ink-dim);
}
.dt-top span { max-width: 48%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* ---- stage name and speaker ---- */

.dt-head { margin-top: 4.5cqh; max-width: 82cqw; }
.dt-title {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  margin: 0;
  font-family: var(--font-title);
  font-size: 5.6cqh;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: .04em;
  overflow-wrap: anywhere;
}
.dt-stage[data-long="true"] .dt-title { font-size: 4.2cqh; }
.dt-speaker {
  margin: 1.3cqh 0 0;
  overflow: hidden;
  font-size: 2.8cqh;
  letter-spacing: .12em;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: var(--speaker-ink);
}
.dt-speaker:empty { display: none; }
.dt-stage[data-mode="title"] .dt-head { display: none; }

/* ---- digits ---- */

.dt-clock { line-height: 1; }
.dt-clock[data-clock="main"] {
  position: absolute;
  left: 50%;
  top: var(--clock-y);
  translate: -50% -50%;
}
.dt-stage:not([data-mode="stage"]) .dt-clock[data-clock="main"],
.dt-stage[data-kind="dual"] .dt-clock[data-clock="main"] { display: none; }
.dt-stage[data-kind="single"] .dt-clock { color: var(--on-side); }

.dt-digits {
  position: relative;             /* the box the overtime sign hangs from; .dt-digits-on stays absolute */
  display: flex;
  color: var(--digits-off-field);
  align-items: baseline;
  justify-content: center;
  white-space: nowrap;
  font-family: var(--font-digits);
  font-size: min(38cqh, 30cqw);
  font-variant-numeric: tabular-nums;
  /* Tension: light and wide when the clock is full, heavy and narrow at zero (spec §5.3). */
  font-variation-settings: "wght" calc(300 + 400 * var(--tension)), "wdth" calc(100 - 22 * var(--tension));
  letter-spacing: -.01em;
  /* Numerals have no descenders: drop them a little so the glyphs, not the line box, sit on the centre line. */
  translate: 0 .07em;
  transition: color 300ms ease;
}
/* The colon breathes while its clock runs. Starting and stopping are from-only one-shots: started, it rises from
   --colon-rest into the breath; stopped, the breath goes and it settles in 200 ms from where the breath was
   (--colon-from, which render.js reads off each colon as its clock stops) to --colon-rest, and then nothing runs on
   it. A running animation, or a finished `forwards` fill, keeps the colon composited, and inside a free debate's
   filtered waiting half that makes the half a surface redrawn with its filter every frame. render.js sets
   --beat-delay on a clock as it starts, so the breath peaks as the seconds change. A still stands running at the
   breath's start (1) and stopped at --colon-rest. */
.dt-colon {
  padding: 0 .03em;
  opacity: var(--colon-rest, .55);
  transition: color 300ms ease;
  animation: dt-colon-settle 200ms ease;
}
.dt-clock[data-running="true"] .dt-colon {
  animation: dt-breathe 1000ms ease-in-out var(--beat-delay, 0ms) infinite, dt-colon-wake 200ms ease;
}
.dt-clock[data-phase="warn"] .dt-colon,
.dt-clock[data-phase="count"] .dt-colon { color: var(--accent); }
/* Overtime: the digits and the colon take --over-ink together, so the gold warn colon does not pass through another
   colour on the way. */
.dt-clock[data-phase="over"] .dt-digits,
.dt-clock[data-phase="over"] .dt-colon { color: var(--over-ink, var(--accent)); }
/* The overtime sign hangs outside the row, left of the digits, so they keep their place when it comes; it fades in
   with the colour change, then breathes. The layers' clips reach -50% past their box, so it is not cut. */
.dt-sign { position: absolute; top: 0; right: 100%; margin-right: .04em; opacity: 1; transition: opacity 300ms ease; }
.dt-sign:empty { opacity: 0; }
/* The breath waits out the fade's 300 ms. */
.dt-clock[data-phase="over"] .dt-sign { animation: dt-breathe 2000ms ease-in-out 300ms infinite; }
/* Hung outside the row, the sign of +MM:SS would leave a stage squarer than about 1.42:1 (4:3, 5:4). There it joins
   the row once the minutes have two digits (render.js data-long), at +10:00, where the row re-centres anyway. */
@container (max-aspect-ratio: 3/2) { .dt-clock[data-phase="over"][data-long] .dt-sign { position: static; } }
.dt-clock.is-bump .dt-digits { animation: dt-bump 240ms ease-out; }

/* Two layers of the same digits (spec §1.5): .dt-digits in --digits-off-field, and over it .dt-digits-on in
   --digits-on-field, each clipped to its own side of the field's edge, so the digits read on both. --cut is
   where that edge falls in the digits' own box: from its left on a single stage (the clock is centred on the
   stage), from its top in a dual half (the clock is centred at 52% of the half, the glyphs dropped .07em).
   The on-field layer reaches 1px past the edge: two clips that meet at a fractional pixel each leave that pixel
   part transparent, and the dark ground shows through as a hairline across the digit. */
.dt-digits-on { display: none; position: absolute; inset: 0; color: var(--digits-on-field); }
.dt-stage[data-kind="single"] .dt-digits-on,
.dt-half .dt-digits-on { display: flex; }

.dt-stage[data-kind="single"] .dt-clock { --cut: calc((1 - var(--used)) * 100cqw - 50cqw + 50%); }
.dt-stage[data-kind="single"] .dt-digits-on { clip-path: inset(-50% calc(100% - var(--cut) - 1px) -50% -50%); }
.dt-stage[data-kind="single"] .dt-digits:not(.dt-digits-on) { clip-path: inset(-50% -50% -50% var(--cut)); }
/* The field taken back toward the right-hand seat: it lies to the right of the edge. */
.dt-stage[data-kind="single"][data-pro-seat="right"][data-side="pro"] .dt-clock,
.dt-stage[data-kind="single"][data-pro-seat="left"][data-side="con"] .dt-clock {
  --cut: calc(var(--used) * 100cqw - 50cqw + 50%);
}
.dt-stage[data-kind="single"][data-pro-seat="right"][data-side="pro"] .dt-digits-on,
.dt-stage[data-kind="single"][data-pro-seat="left"][data-side="con"] .dt-digits-on {
  clip-path: inset(-50% -50% -50% calc(var(--cut) - 1px));
}
.dt-stage[data-kind="single"][data-pro-seat="right"][data-side="pro"] .dt-digits:not(.dt-digits-on),
.dt-stage[data-kind="single"][data-pro-seat="left"][data-side="con"] .dt-digits:not(.dt-digits-on) {
  clip-path: inset(-50% calc(100% - var(--cut)) -50% -50%);
}

.dt-half { --field-top: calc((1 - var(--remain, 1)) * 100cqh); }   /* a theme with another field geometry sets it */
.dt-half .dt-clock { --cut: calc(var(--field-top) - 52cqh + 50% - .07em); }
.dt-half .dt-digits-on { clip-path: inset(calc(var(--cut) - 1px) -50% -50% -50%); }
.dt-half .dt-digits:not(.dt-digits-on) { clip-path: inset(-50% -50% calc(100% - var(--cut)) -50%); }

/* 「暂停」 hangs below the digits without moving them. */
.dt-state {
  position: absolute;
  top: 100%;
  left: 50%;
  translate: -50% 0;
  margin-top: 1.4cqh;
  font-size: 2.8cqh;
  letter-spacing: .5em;
  text-indent: .5em;
  white-space: nowrap;
  opacity: .72;
  transition: opacity 200ms ease;
}
.dt-state:empty { opacity: 0; }
/* Emptied on resume, it keeps its word (render.js data-was, 「暂停」 only) while it fades out; a new stage cuts it. */
.dt-state:empty::before { content: attr(data-was) / ""; }
.dt-stage.is-entering .dt-state { transition: none; }

/* ---- dual: two halves by seat, the speaking side widens to 58% ---- */

.dt-halves {
  display: none;
  grid-template-columns: var(--left-col, 50%) var(--right-col, 50%);
  transition: grid-template-columns 520ms var(--ease-spring);
}
.dt-stage[data-mode="stage"][data-kind="dual"] .dt-halves { display: grid; }
.dt-stage[data-kind="dual"] .dt-top,
.dt-stage[data-kind="dual"] .dt-bottom::before { display: none; }
.dt-stage[data-kind="dual"] .dt-head { margin-top: 6cqh; max-width: 36cqw; }

.dt-half {
  --side-color: var(--pro);
  --side-deep: var(--pro-deep);
  position: relative;
  min-width: 0;
  overflow: hidden;
  background: var(--half-ground, var(--side-deep));   /* a painter theme sets it transparent to show its canvas */
  --dim: 0;
  /* A theme that declares another transition here lists filter and --dim again (and --remain in the locked rule). */
  transition: filter 520ms var(--ease-out), --dim 520ms var(--ease-out);
}
.dt-half[data-side="con"] { --side-color: var(--con); --side-deep: var(--con-deep); }
.dt-half + .dt-half { box-shadow: inset 1px 0 0 color-mix(in oklab, var(--ink) 16%, transparent); }
.dt-halves:not([data-idle]) .dt-half:not([data-active]) { filter: saturate(.45) brightness(.78); --dim: 1; }

/* Each half is its side's field, drained from the top like a falling water level. */
.dt-half-field {
  position: absolute;
  inset: auto 0 0;
  height: calc(var(--remain, 1) * 100%);
  background: var(--side-color);
  clip-path: inset(0);
}

.dt-team {
  position: absolute;
  z-index: 1;
  top: 4.2cqh;
  left: 5cqw;
  right: 5cqw;
  display: flex;
  align-items: baseline;
  gap: .7em;
  overflow: hidden;
  white-space: nowrap;
  font-family: var(--font-title);
  font-size: 3.2cqh;
  color: var(--on-side);
}
.dt-half:last-child .dt-team { flex-direction: row-reverse; }
.dt-team[data-long="true"] { font-size: 2.6cqh; }
/* The name has a box of its own so a joint team's long name ends in an ellipsis instead of mid-glyph. */
.dt-team-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.dt-team:not([data-label=""])::before {
  flex: none;
  content: attr(data-label);
  font-family: var(--font-ui);
  font-size: .7em;
  letter-spacing: .3em;
  opacity: .75;
}

.dt-half .dt-clock {
  position: absolute;
  z-index: 1;
  left: 50%;
  top: 52%;
  translate: -50% -50%;
  color: var(--on-side);
}
.dt-half .dt-digits {
  font-size: min(15cqh, 9cqw);
  transition: font-size 520ms var(--ease-out), color 300ms ease;
}
.dt-halves[data-idle] .dt-digits { font-size: min(24cqh, 14cqw); }
.dt-half[data-active] .dt-digits { font-size: min(30cqh, 17cqw); }
/* A side out of time: its digits recede where they stood, keeping the clock's size, and 时间到 / 已放弃 fades in over
   their place once they are gone. The end state holds at once; only the transitions wait for the entrance to be over,
   so a stage that opens with a side already out shows it still (a transition fires on a change, an animation whenever
   its rule starts to match, so animations are never gated this way). */
.dt-half[data-locked] .dt-digits { opacity: 0; scale: .92; }
.dt-half[data-locked] .dt-state {
  position: absolute;
  top: 50%;
  left: 50%;
  margin: 0;
  translate: -50% -50%;
  font-family: var(--font-title);
  font-size: 6cqh;
  letter-spacing: .3em;
  opacity: .92;
  animation: dt-fade-in 300ms ease 200ms backwards;   /* not `both`: a held opacity keeps it composited in the half */
}
.dt-stage:not(.is-entering) .dt-half[data-locked] .dt-digits {
  transition: font-size 520ms var(--ease-out), color 300ms ease, opacity 240ms ease, scale 240ms var(--ease-out);
}
/* A yield empties the time left at once: every reader of --remain drains with the spring instead. Unlocking (undo,
   reset) is still a cut, and the per-frame drain never eases. */
.dt-stage:not(.is-entering) .dt-half[data-locked] {
  transition: filter 520ms var(--ease-out), --dim 520ms var(--ease-out), --remain 520ms var(--ease-out);
}

/* The speaker's gold floor line (spec §5.4): on the floor of the half, its full width, opening from the middle. */
.dt-floorline {
  position: absolute;
  z-index: 1;
  left: 0;
  right: 0;
  bottom: 0;
  height: max(4px, .4cqh);
  background: var(--accent);
  transform: scaleX(0);
  transition: transform 520ms var(--ease-out);
}
.dt-half[data-active] .dt-floorline { transform: scaleX(1); }

/* ---- cards: title, break, end ---- */

.dt-card { display: none; flex-direction: column; }
.dt-stage[data-mode="title"] .dt-card,
.dt-stage[data-mode="end"] .dt-card,
.dt-stage[data-mode="stage"][data-kind="break"] .dt-card { display: flex; }

.dt-motions { display: flex; flex-direction: column; gap: 2.2cqh; }
.dt-motion {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  position: relative;
  overflow: hidden;
  margin: 0;
  padding-left: .85em;
  font-family: var(--font-title);
  line-height: 1.32;
  letter-spacing: .03em;
  overflow-wrap: anywhere;
}
.dt-motion::before {
  content: "";
  position: absolute;
  left: 0;
  top: .16em;
  width: .2em;
  height: 1em;
  background: var(--pro);
}
.dt-motion[data-side="con"]::before { background: var(--con); }

.dt-teams { display: none; }
.dt-record { display: none; }
.dt-stage[data-mode="end"] .dt-motions { display: none; }
.dt-stage[data-mode="end"] .dt-record { display: table; }

/* Title card: motions in the upper half, the two teams by seat in the lower half, both on the centre axis. */
.dt-stage[data-mode="title"] .dt-card { flex: 1; justify-content: center; gap: 11cqh; padding: 0 3cqw; }
.dt-stage[data-mode="title"] .dt-motions { align-self: center; }
.dt-stage[data-mode="title"] .dt-motion { max-width: 84cqw; font-size: 6cqh; }
.dt-stage[data-mode="title"] .dt-teams {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  font-family: var(--font-title);
  font-size: 4.4cqh;
  line-height: 1.25;
}
.dt-teams::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 8%;
  bottom: 8%;
  width: 1px;
  background: var(--ink-dim);
}
.dt-teams span { min-width: 0; padding: 0 4cqw; overflow-wrap: anywhere; }
.dt-teams span:first-child { text-align: right; }
.dt-teams span:not([data-label=""])::before {
  content: attr(data-label);
  display: block;
  margin-bottom: 1.2cqh;
  font-family: var(--font-ui);
  font-size: .5em;
  letter-spacing: .4em;
  color: color-mix(in oklab, var(--pro) 50%, var(--ink));
}
.dt-teams span[data-side="con"]::before { color: color-mix(in oklab, var(--con) 45%, var(--ink)); }

/* Break: name, relaxed digits and the motions, centred as one group. */
.dt-stage[data-mode="stage"][data-kind="break"] .dt-head { margin: auto auto 0; max-width: 86cqw; text-align: center; }
.dt-stage[data-mode="stage"][data-kind="break"] .dt-clock[data-clock="main"] {
  position: relative;
  left: auto;
  top: auto;
  translate: none;
  margin-top: 3cqh;
}
.dt-stage[data-kind="break"] .dt-digits { font-size: 22cqh; }
.dt-stage[data-mode="stage"][data-kind="break"] .dt-card { margin: 7cqh auto auto; max-width: 86cqw; }
.dt-stage[data-mode="stage"][data-kind="break"] .dt-motion { font-size: 3.4cqh; }
.dt-stage[data-mode="stage"][data-kind="break"] .dt-bottom { margin-top: 0; }

/* End card: the match record, as large as fits so the room can read it (spec §5.4); like the title card it
   sits on the centre axis. */
.dt-stage[data-mode="end"] .dt-head { align-self: center; text-align: center; }
.dt-stage[data-mode="end"] .dt-card { margin-top: 3.6cqh; min-height: 0; }
.dt-record {
  align-self: center;
  border-collapse: collapse;
  /* The rows fill what is left above the bar: --record-budget is that height, less for a theme whose head or card
     takes more of the stage (chroma's plates). */
  font-size: min(2.6cqh, calc(var(--record-budget, 68cqh) / var(--rows, 20) / 1.5));
  line-height: 1.5;
}
.dt-record th, .dt-record td { padding: 0 4em 0 0; text-align: left; white-space: nowrap; }
.dt-record th {
  padding-bottom: .35em;
  border-bottom: 1px solid color-mix(in oklab, var(--ink) 22%, transparent);
  font-weight: normal;
  letter-spacing: .2em;
  color: var(--ink-dim);
}
.dt-record tr:nth-child(2) td { padding-top: .45em; }
.dt-record td:first-child { max-width: 56cqw; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-title); }
.dt-record td:first-child::before {
  content: "";
  display: inline-block;
  width: .5em;
  height: .5em;
  margin-right: .8em;
  vertical-align: .12em;
  background: color-mix(in oklab, var(--ground) 45%, var(--ink));   /* a break: the progress bar's grey */
}
.dt-record tr[data-side="pro"] td:first-child::before { background: var(--pro); }
.dt-record tr[data-side="con"] td:first-child::before { background: var(--con); }
.dt-record tr[data-kind="dual"] td:first-child::before { background: linear-gradient(90deg, var(--pro) 50%, var(--con) 50%); }
.dt-record td:not(:first-child) { font-family: var(--font-digits); font-variant-numeric: tabular-nums; }
.dt-record tr[data-over] td:nth-child(n+3) { color: var(--accent); }
.dt-record tr[data-skipped] { opacity: .45; }

/* ---- bottom bar: progress and what comes next ---- */

.dt-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4cqw;
  margin-top: auto;
  font-size: 2cqh;
  color: var(--ink-dim);
}
.dt-bottom::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: -7cqh -5cqw -3.6cqh;
  background: linear-gradient(to top, color-mix(in oklab, var(--side-deep) 55%, transparent), transparent);
}

.dt-progress { display: flex; align-items: flex-end; gap: .35cqh; min-width: 0; }
.dt-seg {
  --seg: color-mix(in oklab, var(--ground) 45%, var(--ink));
  position: relative;
  display: block;
  flex: none;
  width: 1.7cqh;
  height: 1cqh;
  border-radius: .2cqh;
  background: var(--seg);
  box-shadow: 0 0 0 1px color-mix(in oklab, var(--ink) 22%, transparent);
  opacity: .35;
  transition: opacity 300ms ease;
}
.dt-seg[data-side="pro"] { --seg: var(--pro); }
.dt-seg[data-side="con"] { --seg: var(--con); }
.dt-seg[data-kind="dual"] { background: linear-gradient(90deg, var(--pro) 50%, var(--con) 50%); }
.dt-seg[data-gap] { margin-left: 1.1cqh; }
.dt-seg[data-state="done"], .dt-seg[data-state="current"] { opacity: 1; }
.dt-seg[data-state="current"]::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -.75cqh;
  height: .35cqh;
  border-radius: .2cqh;
  background: var(--accent);
  animation: dt-fade-in 300ms ease backwards;
}

.dt-next { display: flex; align-items: baseline; gap: 1.1em; min-width: 0; white-space: nowrap; }
.dt-next span:empty { display: none; }
.dt-next-label { letter-spacing: .2em; }
.dt-next-name { overflow: hidden; text-overflow: ellipsis; font-family: var(--font-title); color: var(--ink); }
.dt-next-time { font-family: var(--font-digits); font-variant-numeric: tabular-nums; color: var(--ink); }
.dt-halves[data-idle] ~ .dt-bottom .dt-next-name { color: var(--accent); }

/* ---- rings and toast ---- */

/* A bell's ring: an ellipse round the glyphs of the clock that rang, inside that clock and under its digits (the clock
   is a stacking context), so it rides the free debate's spring and stays where a locked side's digits were. render.js
   writes the glyphs' size in stage percent (--bell-w of the width, --bell-h of the height) and their centre's offset
   from the clock's (--bell-dy, of the height), and in a half --ring-to, a last scale that stays inside its column.
   From 1.15 it starts clear of the glyphs' corners; at 1.65 it still clears a single stage's speaker line. A break's
   ring stops at 1.2 (below): its centred name sits 3cqh above the digits, and the clock paints over the head. Centred
   by its margins, so a theme's own ring is free to use translate. It cannot blend with the field (mix-blend-mode) from
   inside the clock, and in a half it takes the half's dimming. */
.dt-ring {
  --ring-w: calc(var(--bell-w, 30) * 1cqw + 3cqh);
  --ring-h: calc(var(--bell-h, 30) * 1cqh + 3cqh);
  position: absolute;
  left: 50%;
  top: calc(50% + var(--bell-dy, 0) * 1cqh);
  width: var(--ring-w);
  height: var(--ring-h);
  margin: calc(var(--ring-h) / -2) 0 0 calc(var(--ring-w) / -2);
  z-index: -1;
  pointer-events: none;
  border: .45cqh solid var(--accent);
  border-radius: 50%;
  opacity: 0;
  animation: dt-ring 1100ms ease-out forwards;
}
.dt-stage[data-kind="break"] .dt-ring { --ring-to: 1.2; }

.dt-toast {
  position: absolute;
  top: 0;
  left: 50%;
  max-width: 70cqw;
  padding: 1.3cqh 3.2cqh;
  border-bottom: .3cqh solid var(--accent);
  border-radius: 0 0 1.2cqh 1.2cqh;
  background: color-mix(in oklab, var(--ground) 94%, var(--ink));
  color: var(--ink);
  font-size: 2.4cqh;
  letter-spacing: .06em;
  white-space: nowrap;
  translate: -50% -110%;
  transition: translate 200ms ease-in;
}
.dt-toast.is-shown { translate: -50% 0; transition-timing-function: var(--ease-out); }
.dt-toast:empty { visibility: hidden; }

/* ---- the one orchestrated moment: a new stage sweeps in from its side's seat ---- */

.dt-stage.is-entering .dt-field { animation: dt-sweep-l 560ms var(--ease-out); }
.dt-stage.is-entering[data-pro-seat="right"][data-side="pro"] .dt-field,
.dt-stage.is-entering[data-pro-seat="left"][data-side="con"] .dt-field { animation-name: dt-sweep-r; }
.dt-stage.is-entering .dt-half:first-child .dt-half-field { animation: dt-sweep-l 560ms var(--ease-out); }
.dt-stage.is-entering .dt-half:last-child .dt-half-field { animation: dt-sweep-r 560ms var(--ease-out); }
/* The text rises in reading order, 0 / 70 / 140 ms; a card's parts each on their own (the break: name, digits, then the
   motions). The warn line comes in with the field. Fill `backwards`, never `both`: an animation that holds a property
   after it ends stops every transition on it until the class goes (1100 ms). */
.dt-stage.is-entering .dt-title,
.dt-stage.is-entering .dt-motions { animation: dt-rise 420ms var(--ease-out) backwards; }
.dt-stage.is-entering .dt-speaker,
.dt-stage.is-entering .dt-team,
.dt-stage.is-entering .dt-teams { animation: dt-rise 420ms var(--ease-out) 70ms backwards; }
.dt-stage.is-entering .dt-clock,
.dt-stage.is-entering .dt-record { animation: dt-rise 420ms var(--ease-out) 140ms backwards; }
.dt-stage.is-entering[data-mode="stage"][data-kind="break"] .dt-motions { animation-delay: 210ms; }
.dt-stage.is-entering .dt-warnline { animation: dt-fade-in 300ms var(--ease-out) 260ms backwards; }

/* No `to` frame: the sweep ends on the field's live clip-path. Likewise every one-shot below that has only a `from`
   ends on the live value, so a still ([data-still]) shows it landed. */
@keyframes dt-sweep-l { from { clip-path: inset(0 100% 0 0); } }
@keyframes dt-sweep-r { from { clip-path: inset(0 0 0 100%); } }
@keyframes dt-rise { from { opacity: 0; transform: translateY(1.1cqh); } }
@keyframes dt-fade-in { from { opacity: 0; } }
/* A theme's overtime mark lands on the second bell: animation: dt-stamp 300ms var(--ease-out) 320ms backwards.
   Fill backwards, not both: a held fill keeps the mark composited, and with it any filtered ancestor. */
@keyframes dt-stamp { from { opacity: 0; scale: 1.12; } }
@keyframes dt-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
@keyframes dt-colon-settle { from { opacity: var(--colon-from, var(--colon-rest, .55)); } }
@keyframes dt-colon-wake { from { opacity: var(--colon-rest, .55); } }
@keyframes dt-bump { from { transform: scale(1.07); } }
@keyframes dt-ring {
  from { scale: 1.15; opacity: .8; }
  to { scale: var(--ring-to, 1.65); opacity: 0; }
}

/* A frozen demo (?demo=…&frozen=1) is a still for review: it shows each state at its end. A transition lands at
   once; an animation stands 10 s in, so a one-shot is over (a ring gone, an entrance risen) and a loop is at its
   start (a breathe at full strength), however long the browser took to take the picture. This also keeps a headless
   browser from stalling a transition part way, as it does under a painter's canvas. */
.dt-stage[data-still], .dt-stage[data-still]::before, .dt-stage[data-still]::after,
.dt-stage[data-still] *, .dt-stage[data-still] *::before, .dt-stage[data-still] *::after {
  transition: none !important;
  animation-delay: -10s !important;
  animation-play-state: paused !important;
}

@media (prefers-reduced-motion: reduce) {
  .dt-stage, .dt-stage::before, .dt-stage::after, .dt-stage *, .dt-stage *::before, .dt-stage *::after {
    animation: none !important;
    transition: none !important;
  }
}

/* === styles/console.css === */
/* console.css: the timekeeper's layer over the stage: control dock, status pills, overlays, the console beside
   a projector window, and the projector window's first hint (spec §5.7, §5.11).
   Quiet surfaces in the theme's own colours, so the stage stays the only loud thing on screen. */

/* ---- shared surface ---- */

.dt-app, .dt-console {
  /* Chroma's dark plate when there is one, otherwise the ground lifted a little toward the ink. */
  --panel: var(--plate, color-mix(in oklab, var(--ground) 91%, var(--ink)));
  --panel-line: color-mix(in oklab, var(--ink) 15%, transparent);
  --panel-hover: color-mix(in oklab, var(--ink) 9%, transparent);
  --panel-shadow: 0 1.2em 3em rgb(0 0 0 / .32);
  --console-ease: cubic-bezier(.2, .8, .2, 1);
  /* Words on a solid --accent fill (an armed 重置 / 退出). A theme whose accent is too close to its panel names
     another (daylight: its ink; ink: its paper-coloured ink); themes.test.js holds every theme to 4.5:1. */
  --on-accent: var(--panel);
}

/* The root is the size container, so the layer is measured in the same cqh as the stage. */
.dt-dock, .dt-status, .dt-overlay, .dt-console, .dt-projector-hint {
  --ui: clamp(13px, 1.55cqh, 22px);
  font-family: var(--font-ui);
  font-size: var(--ui);
  line-height: 1.4;
  color: var(--ink);
  font-synthesis: none;
}

/* Zero specificity, so each component's own button rules win without !important. */
:where(.dt-dock, .dt-overlay, .dt-console) button {
  margin: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  cursor: pointer;
}
.dt-dock button:focus-visible, .dt-overlay button:focus-visible, .dt-console button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.dt-dock button:disabled, .dt-overlay button:disabled, .dt-console button:disabled { opacity: .34; cursor: default; }

.dt-dock kbd, .dt-overlay kbd, .dt-console kbd, .dt-projector-hint kbd {
  display: inline-block;
  min-width: 1.6em;
  padding: .08em .42em;
  border: 1px solid var(--panel-line);
  border-bottom-width: 2px;
  border-radius: .32em;
  font-family: var(--font-ui);
  font-size: .76em;
  line-height: 1.35;
  letter-spacing: 0;
  text-align: center;
  color: var(--ink-dim);
}

.dt-swatch {
  flex: none;
  width: .62em;
  height: .62em;
  border-radius: .12em;
  background: var(--pro);
}
.dt-swatch[data-side="con"] { background: var(--con); }

.dt-dock svg { flex: none; width: .8em; height: .8em; fill: currentColor; }
.dt-pill svg { flex: none; width: 1.15em; height: 1.15em; fill: currentColor; }

/* The pointer disappears from the projection with the dock; it comes back on the next movement. */
.dt-app[data-idle]:not([data-layout="console"]) .dt-stage { cursor: none; }

/* ---- dock: floats above the bottom bar, below the digits ---- */

.dt-dock {
  --ui: clamp(13px, min(1.55cqh, 1.05cqw), 22px);   /* on a screen squarer than 16:9 it follows the width too */
  position: absolute;
  z-index: 20;
  left: 50%;
  bottom: 8.5cqh;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .3em;
  width: max-content;   /* shrink-to-fit would stop at the half width left of `left: 50%` */
  max-width: 90cqw;
  padding: .36em;
  border: 1px solid var(--panel-line);
  border-radius: .75em;
  background: var(--panel);
  box-shadow: var(--panel-shadow);
  letter-spacing: .06em;
  opacity: 0;
  translate: -50% .9em;
  pointer-events: none;
  transition: opacity 200ms var(--console-ease), translate 260ms var(--console-ease);
}
.dt-dock[data-shown] { opacity: 1; translate: -50% 0; pointer-events: auto; }
/* A pinned dock (a still for review) is simply there, with no entrance to catch half way. */
.dt-dock[data-pinned] { transition: none; }

.dt-dock-group { display: flex; gap: .15em; }
.dt-dock-group + .dt-dock-group { padding-left: .3em; border-left: 1px solid var(--panel-line); }
/* 退出 stands apart at the far end, out of reach of a hand going for 全屏: the room split evenly around its divider. */
.dt-dock-group[data-exit] { margin-left: .45em; padding-left: .75em; }

.dt-dock button {
  display: inline-flex;
  align-items: center;
  gap: .45em;
  padding: .55em .6em;
  border-radius: .5em;
  white-space: nowrap;
}
.dt-dock button:hover:not(:disabled) { background: var(--panel-hover); }
.dt-dock button[data-primary] {
  justify-content: center;
  min-width: 7.6em;
  background: color-mix(in oklab, var(--ink) 13%, transparent);
}
.dt-dock button[data-primary]:hover:not(:disabled) { background: color-mix(in oklab, var(--ink) 19%, transparent); }
.dt-dock .dt-icon { display: inline-flex; }
.dt-dock button[hidden] { display: none; }
/* Where the dock with its key hints would not fit on one row (below about 1320px wide, or a screen squarer than
   16:10, such as a 4:3 projector at 1024x768), the hints go: the dock stays one row, and 退出 stays apart. The
   help (H) still lists every key. */
@container (max-width: 1320px) or (max-aspect-ratio: 159 / 100) {
  .dt-dock { letter-spacing: .03em; }
  .dt-dock kbd { display: none; }
  .dt-dock button { padding-inline: .5em; }
  .dt-dock button[data-primary] { min-width: 6.4em; }
}

/* ---- status pills: top right, under the top bar ---- */

.dt-status {
  position: absolute;
  z-index: 15;
  top: 9cqh;
  right: 5cqw;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: .5em;
  font-size: clamp(12px, 1.4cqh, 20px);
  pointer-events: none;
}
.dt-pill {
  display: inline-flex;
  align-items: center;
  gap: .45em;
  padding: .38em .95em;
  border: 1px solid var(--panel-line);
  border-radius: 999px;
  background: var(--panel);
  color: var(--ink-dim);
  letter-spacing: .1em;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  transition: opacity 400ms ease, visibility 0s linear 400ms;
}
.dt-pill[data-shown] { opacity: 1; visibility: visible; transition: opacity 400ms ease; }
.dt-pill[data-kind="muted"] { order: -1; color: var(--accent); }

/* ---- overlays ---- */

.dt-overlay {
  position: absolute;
  z-index: 30;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.dt-scrim {
  position: absolute;
  inset: 0;
  background: color-mix(in oklab, var(--ground) 50%, transparent);
  animation: dt-fade 200ms ease both;
}

.dt-panel {
  position: relative;
  display: flex;
  flex-direction: column;
  width: min(44em, 90cqw);
  max-height: 86cqh;
  border: 1px solid var(--panel-line);
  border-radius: .8em;
  background: var(--panel);
  box-shadow: var(--panel-shadow);
  outline: none;
  animation: dt-panel-in 240ms var(--console-ease) both;
}
.dt-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2em;
  padding: 1em 1.1em .85em 1.5em;
  border-bottom: 1px solid var(--panel-line);
}
.dt-panel-head h2 {
  margin: 0;
  font-family: var(--font-title);
  font-size: 1.3em;
  font-weight: 600;
  letter-spacing: .14em;
}
.dt-close { padding: .3em; border-radius: .4em; }
.dt-close:hover kbd { color: var(--ink); }
.dt-panel-body { min-height: 0; overflow: auto; padding: .7em 1.5em 1.3em; }
.dt-panel-foot {
  display: flex;
  justify-content: flex-end;
  padding: .9em 1.5em 1.1em;
  border-top: 1px solid var(--panel-line);
}
.dt-button {
  padding: .5em 1.3em;
  border: 1px solid var(--panel-line);
  border-radius: .5em;
  letter-spacing: .1em;
}
.dt-button:hover { background: var(--panel-hover); }
.dt-hint { margin: 1.1em 0 0; font-size: .88em; letter-spacing: .06em; color: var(--ink-dim); }

/* Stage list: a drawer from the left; the stage stays in view beside it. */
.dt-overlay[data-name="stages"] { justify-content: flex-start; align-items: stretch; }
.dt-overlay[data-name="stages"] .dt-scrim { background: color-mix(in oklab, var(--ground) 28%, transparent); }
.dt-overlay[data-name="stages"] .dt-panel {
  width: min(30em, 46cqw);
  max-height: none;
  border-width: 0 1px 0 0;
  border-radius: 0;
  animation-name: dt-drawer-in;
}

.dt-stagelist { margin: 0 -.6em; padding: 0; list-style: none; }
.dt-row {
  display: grid;
  grid-template-columns: 1.6em .24em minmax(0, 1fr) auto 4.8em;
  align-items: center;
  gap: .75em;
  width: 100%;
  padding: .5em .6em;
  border-radius: .45em;
  text-align: left;
}
.dt-row-index, .dt-row-plan, .dt-row-state {
  font-family: var(--font-digits);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--ink-dim);
}
.dt-row-index { text-align: right; }
.dt-row-side {
  align-self: stretch;
  border-radius: .12em;
  background: color-mix(in oklab, var(--ground) 50%, var(--ink));
}
.dt-row[data-side="pro"] .dt-row-side { background: var(--pro); }
.dt-row[data-side="con"] .dt-row-side { background: var(--con); }
.dt-row[data-kind="dual"] .dt-row-side { background: linear-gradient(var(--pro) 50%, var(--con) 50%); }
.dt-row-name { overflow: hidden; font-family: var(--font-title); white-space: nowrap; text-overflow: ellipsis; }
.dt-row-state { text-align: right; }
/* Gold means overtime here (spec §5.7); the current row's time is plain ink behind a gold dot. */
.dt-row[aria-current] .dt-row-state { color: var(--ink); }
.dt-row[data-over] .dt-row-state, .dt-row-dot { color: var(--accent); }

/* A stage that has been timed offers ↺ at the row's end: quiet until the row is pointed at or focused. Armed, it
   widens over the row's end to say 再点一次重置 and the time it would throw away. */
.dt-stagelist-item { position: relative; display: flex; align-items: center; padding-right: .25em; border-radius: .45em; }
.dt-stagelist-item .dt-row { flex: 1; min-width: 0; }
/* The highlight is the whole item's, so the ↺ sits inside it, and so is a block's gap, so the ↺ centres on its row. */
.dt-stagelist-item[data-gap] { margin-top: .75em; }
.dt-stagelist-item:hover { background: var(--panel-hover); }
.dt-stagelist-item:has(> .dt-row[aria-current]) { background: color-mix(in oklab, var(--ink) 12%, transparent); }
.dt-row-reset {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  gap: .4em;
  width: 1.75em;
  height: 1.75em;
  margin-left: .1em;
  border-radius: .45em;
  color: var(--ink-dim);
  opacity: .55;
  white-space: nowrap;
}
.dt-row-reset[hidden] { display: inline-flex; visibility: hidden; }   /* keeps its room, so the rows line up */
.dt-stagelist-item:hover .dt-row-reset, .dt-row-reset:focus-visible { opacity: 1; color: var(--ink); }
.dt-row-reset:hover { background: var(--panel-hover); }
.dt-row-reset-icon { font-family: var(--font-ui); font-size: 1.15em; line-height: 1; }
.dt-row-reset-label { display: none; }
.dt-stagelist-item .dt-row-reset[data-armed] {
  position: absolute;
  right: .25em;
  width: auto;
  padding: 0 .75em;
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 600;
  opacity: 1;
}
.dt-row-reset[data-armed] .dt-row-reset-label { display: inline; }
/* The armed ↺ leaves the flow; the row keeps the room it had, so no name re-wraps and no row below moves between
   the two clicks. */
.dt-stagelist-item:has(> .dt-row-reset[data-armed]) > .dt-row { margin-right: 1.85em; }

/* Help: the key table, in two columns where the panel is wide enough (ui.js helpOverlay). */
.dt-overlay[data-name="help"] .dt-panel { width: min(68em, 94cqw); }
.dt-keys-cols { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0 2.6em; }
.dt-keys-cols > .dt-keys { flex: 1 1 26em; width: auto; }
.dt-keys { width: 100%; border-collapse: collapse; }
.dt-keys th, .dt-keys td { padding: .42em 0; vertical-align: baseline; text-align: left; }
.dt-keys tr + tr > * { border-top: 1px solid var(--panel-line); }
.dt-keys th { padding-right: 1.8em; font-weight: normal; white-space: nowrap; }
.dt-keys kbd { color: var(--ink); }
.dt-keys kbd + kbd { margin-left: .45em; }

/* Insert: one row per variant, a button per side. */
.dt-extra h3 {
  margin: .5em 0 .5em;
  font-family: var(--font-title);
  font-size: 1.1em;
  font-weight: 600;
  letter-spacing: .12em;
}
.dt-extra h3 small, .dt-extra-name small {
  margin-left: .9em;
  font-family: var(--font-ui);
  font-size: .76em;
  font-weight: normal;
  letter-spacing: .06em;
  color: var(--ink-dim);
}
.dt-extra-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto auto;
  align-items: center;
  gap: .8em;
  padding: .75em 0;
  border-top: 1px solid var(--panel-line);
}
.dt-extra-name { font-family: var(--font-title); }
.dt-extra-name small { display: block; margin: .2em 0 0; }
.dt-extra-time { font-family: var(--font-digits); font-variant-numeric: tabular-nums; color: var(--ink-dim); }
.dt-extra-side {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5em;
  min-width: 6.8em;
  padding: .5em 1em;
  border: 1px solid var(--panel-line);
  border-radius: .5em;
  letter-spacing: .1em;
}
.dt-extra-side:hover:not(:disabled) { background: var(--panel-hover); }

/* Record: the same table as the end card, with the overtime column. */
.dt-record-table { width: 100%; border-collapse: collapse; }
.dt-record-table th, .dt-record-table td { padding: .32em 1.6em .32em 0; text-align: left; white-space: nowrap; }
.dt-record-table th {
  position: sticky;
  top: -.7em;
  padding-top: .7em;
  border-bottom: 1px solid var(--panel-line);
  background: var(--panel);
  font-weight: normal;
  letter-spacing: .2em;
  color: var(--ink-dim);
}
.dt-record-table td:first-child { max-width: 24em; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-title); }
.dt-record-table td:first-child::before {
  content: "";
  display: inline-block;
  width: .5em;
  height: .5em;
  margin-right: .8em;
  vertical-align: .12em;
  background: color-mix(in oklab, var(--ground) 50%, var(--ink));
}
.dt-record-table tr[data-side="pro"] td:first-child::before { background: var(--pro); }
.dt-record-table tr[data-side="con"] td:first-child::before { background: var(--con); }
.dt-record-table td:not(:first-child) { font-family: var(--font-digits); font-variant-numeric: tabular-nums; }
.dt-record-table tr[data-over] td:nth-child(n+3) { color: var(--accent); }
.dt-record-table tr[data-current] td { background: var(--panel-hover); }

/* The copy fallback's textarea, off screen. */
.dt-offscreen { position: fixed; left: -9999px; top: 0; opacity: 0; }

/* ---- console: stage list, preview and controls beside a projector window (spec §5.7) ---- */

/* The console's right column takes over from the dock. */
.dt-app[data-layout="console"] .dt-dock { display: none; }

.dt-console {
  position: absolute;
  z-index: 10;
  inset: 0;
  display: grid;
  grid-template-columns: minmax(0, 28em) minmax(0, 1fr) minmax(0, 19em);   /* 28em: a ten-character name on one line */
  background: var(--ground);
}
.dt-console-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.dt-console-list, .dt-console-controls { background: var(--panel); }
.dt-console-list { border-right: 1px solid var(--panel-line); }
.dt-console-controls { overflow: auto; border-left: 1px solid var(--panel-line); }

/* Column heads: small, spaced, dim; the content below is what matters. */
.dt-console-head {
  display: flex;
  flex: none;
  align-items: center;
  gap: 1.2em;
  min-height: 4.2em;
  margin: 0;
  padding: 0 1.75em;
  font-size: .8em;
  font-weight: normal;
  letter-spacing: .28em;
  color: var(--ink-dim);
}
.dt-console-head h2 { margin: 0; font: inherit; letter-spacing: inherit; }

.dt-console-scroll { flex: 1; min-height: 0; overflow: auto; padding: 0 1.4em 1.4em; }

/* Middle: the preview, as large as the column allows at the projector's 16:9. */
.dt-console-main { padding: 0 2em 1.6em; }
.dt-console-main .dt-console-head { padding: 0; }
.dt-console-status { margin-left: auto; }
.dt-console .dt-status {
  position: static;
  flex-direction: row;
  font-size: 1em;
  letter-spacing: normal;
}
.dt-console .dt-pill:not([data-shown]) { display: none; }
.dt-console-live { display: inline-flex; align-items: center; gap: .7em; letter-spacing: .14em; }
.dt-console-live::before {
  content: "";
  width: .55em;
  height: .55em;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 .3em color-mix(in oklab, var(--accent) 22%, transparent);
}

/* The preview and the note under it, centred together; the preview gets all the room but the note's 5em. */
.dt-preview-frame {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  container-type: size;
}
/* A size container of its own (.dt-stage-host), so the stage inside is laid out exactly as on the projector. */
.dt-preview {
  flex: none;
  width: min(100cqw, (100cqh - 5em) * 16 / 9);
  height: min(100cqh - 5em, 100cqw * 9 / 16);
  border-radius: .45em;
  box-shadow: 0 0 0 1px var(--panel-line), var(--panel-shadow);
}

/* The timekeeper's note for this stage, one line as wide as the preview. Its room is kept when there is none,
   so the preview never jumps. */
.dt-console-note {
  display: flex;
  flex: none;
  align-items: baseline;
  gap: 1.4em;
  width: min(100cqw, (100cqh - 5em) * 16 / 9);
  margin: 1.3em 0 0;
  padding: .85em 1.3em;
  border-left: 3px solid var(--accent);
  border-radius: .2em .5em .5em .2em;
  background: var(--panel);
}
.dt-console-note[hidden] { display: flex; visibility: hidden; }
.dt-console-note-label { flex: none; font-size: .8em; letter-spacing: .24em; color: var(--ink-dim); }
.dt-console-note-text {
  min-width: 0;
  overflow: hidden;
  font-family: var(--font-title);
  letter-spacing: .06em;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* The console's list has room for two lines of a long stage name. */
.dt-console .dt-row-name {
  display: -webkit-box;
  line-height: 1.3;
  white-space: normal;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

/* Right: the controls, grouped as on the sketch; each group a row of equal buttons. */
.dt-control-group {
  display: flex;
  flex-wrap: wrap;
  gap: .45em;
  padding: 1.05em 1.4em;
  border-top: 1px solid var(--panel-line);
}
.dt-console-head + .dt-control-group { padding-top: 0; border-top: 0; }
.dt-console-controls button {
  display: inline-flex;
  flex: 1 1 0;
  align-items: center;
  justify-content: center;
  gap: .5em;
  min-width: 0;
  padding: .62em .5em;
  border: 1px solid var(--panel-line);
  border-radius: .5em;
  letter-spacing: .06em;
  white-space: nowrap;
}
.dt-console-controls button:hover:not(:disabled) { background: var(--panel-hover); }
.dt-console-controls button[hidden] { display: none; }
.dt-console-controls button[data-wide] { flex-basis: 100%; }
.dt-console-controls button[data-primary] {
  flex-basis: 100%;
  padding: 1.05em .8em;
  border-color: transparent;
  background: color-mix(in oklab, var(--ink) 13%, transparent);
  font-size: 1.15em;
  letter-spacing: .14em;
}
.dt-console-controls button[data-primary]:hover:not(:disabled) { background: color-mix(in oklab, var(--ink) 19%, transparent); }
.dt-console-controls button[aria-pressed="true"] {
  border-color: color-mix(in oklab, var(--accent) 55%, transparent);
  color: var(--accent);
}
.dt-console-controls .dt-icon { display: inline-flex; }
.dt-console-controls svg { flex: none; width: .8em; height: .8em; fill: currentColor; }
.dt-adjust button { padding-inline: 0; font-family: var(--font-digits); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.dt-adjust-unit { align-self: center; padding-left: .2em; font-size: .9em; color: var(--ink-dim); }
.dt-volume {
  display: flex;
  flex-basis: 100%;
  align-items: center;
  gap: .9em;
  padding-top: .45em;
  letter-spacing: .1em;
  color: var(--ink-dim);
}
.dt-volume input { flex: 1; min-width: 0; margin: 0; accent-color: var(--accent); }
/* 退出 sits last, below everything else. */
.dt-control-group[data-exit] { margin-top: auto; }

/* 重置 and 退出 hold both their faces in one grid cell (ui.js armable): the rest (label and key) and the words that
   ask for the second click. The button is as wide as the longer, so arming moves nothing under the pointer. */
.dt-arm { display: inline-grid; }
.dt-arm > * {
  display: inline-flex;
  grid-area: 1 / 1;
  align-items: center;
  justify-content: center;
  gap: .45em;
}
.dt-arm-ask { visibility: hidden; font-size: .86em; font-weight: 600; letter-spacing: .02em; }
button[data-armed] .dt-arm-rest { visibility: hidden; }
button[data-armed] .dt-arm-ask { visibility: visible; }

/* 重置 or 退出 waiting for its second click (new spec §2.1): a solid gold fill, the warning that the next click acts,
   with words that read at 4.5:1 on it. As specific as the hover rules and after them, so it holds while the
   pointer is still on the button. */
.dt-dock button[data-armed]:not(:disabled), .dt-console-controls button[data-armed]:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: none;
  color: var(--on-accent);
}
/* Under the words, a line drains over the 1.5 s the button waits (ui.js DOUBLE_MS), so a hesitating hand sees the
   window closing. Two names for one animation: data-armed alternates a / b, so each arming starts it over. */
.dt-dock button[data-act], .dt-console-controls button[data-act] { position: relative; }
.dt-dock button[data-armed]::after, .dt-console-controls button[data-armed]::after, .dt-row-reset[data-armed]::after {
  content: "";
  position: absolute;
  left: .6em;
  right: .6em;
  bottom: .2em;
  height: 2px;
  border-radius: 1px;
  background: currentColor;
  transform-origin: left center;
  animation: dt-confirm-drain 1500ms linear both;
}
.dt-dock button[data-armed="b"]::after, .dt-console-controls button[data-armed="b"]::after,
.dt-row-reset[data-armed="b"]::after { animation-name: dt-confirm-drain-again; }

/* ---- projector window: the first hint, gone at the first key ---- */

.dt-projector-hint {
  position: absolute;
  z-index: 25;
  left: 50%;
  bottom: 15cqh;
  padding: 1em 1.8em;
  border: 1px solid var(--panel-line);
  border-radius: .75em;
  background: var(--panel);
  box-shadow: var(--panel-shadow);
  font-size: clamp(14px, 2.4cqh, 32px);
  letter-spacing: .16em;
  white-space: nowrap;
  translate: -50% 0;
  pointer-events: none;
  animation: dt-panel-in 320ms var(--console-ease) both;
}
.dt-projector-hint kbd { margin: 0 .2em; color: var(--ink); }
.dt-projector-hint[hidden] { display: none; }
/* Full screen on the projector: nothing to point at, so no pointer. */
.dt-app[data-layout="projector"]:fullscreen .dt-stage { cursor: none; }

@keyframes dt-fade { from { opacity: 0; } }
@keyframes dt-confirm-drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes dt-confirm-drain-again { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes dt-panel-in { from { opacity: 0; transform: translateY(1.2cqh); } }
@keyframes dt-drawer-in { from { transform: translateX(-100%); } }

@media (prefers-reduced-motion: reduce) {
  .dt-dock, .dt-dock *, .dt-pill, .dt-overlay, .dt-overlay *, .dt-console *, .dt-projector-hint {
    animation: none !important;
    transition: none !important;
  }
  /* No drain to watch: the armed fill says enough. */
  .dt-dock button[data-armed]::after, .dt-console-controls button[data-armed]::after,
  .dt-row-reset[data-armed]::after { display: none; }
}

/* === styles/editor.css === */
/* editor.css: pages outside the stage: the setup page (spec §5.9), the format editor (§5.10), and the form and
   list parts they share. Same palette and type as the stage: the ground and ink, the two side colours,
   the serif for names and motions. Surfaces reuse the console's panel variables from console.css. */

/* ---- shared form parts ---- */

.dt-input {
  width: 100%;
  min-width: 0;
  margin: 0;
  padding: .55em .8em;
  border: 1px solid var(--panel-line);
  border-radius: .45em;
  background: color-mix(in oklab, var(--ground) 72%, transparent);
  color: var(--ink);
  font: inherit;
  letter-spacing: .04em;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.dt-input::placeholder { color: var(--ink-dim); opacity: .6; }
.dt-input:hover { border-color: color-mix(in oklab, var(--ink) 30%, transparent); }
.dt-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.dt-input-title { font-family: var(--font-title); font-size: 1.06em; letter-spacing: .06em; }

/* A format's shape: one segment per stage, as long as the stage, in the stage's side colour. */
.dt-setup-strip { display: flex; gap: 2px; height: .3em; }
.dt-setup-strip i {
  flex: 1 1 0;
  min-width: 2px;
  border-radius: 1px;
  background: color-mix(in oklab, var(--ground) 55%, var(--ink));
}
.dt-setup-strip i[data-side="pro"] { background: var(--pro); }
.dt-setup-strip i[data-side="con"] { background: var(--con); }
.dt-setup-strip i[data-kind="dual"] { background: linear-gradient(var(--pro) 50%, var(--con) 50%); }

/* ---- setup page ---- */

.dt-setup {
  --gap: clamp(20px, 3vw, 56px);
  display: flex;
  flex-direction: column;
  justify-content: safe center;
  gap: clamp(14px, 2.6vh, 32px);
  height: 100%;
  overflow: auto;
  padding: clamp(18px, 4vh, 64px) clamp(16px, 5vw, 96px) clamp(18px, 4.5vh, 56px);
  background: radial-gradient(120% 90% at 50% 25%, transparent 55%, rgb(0 0 0 / .22)), var(--ground);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: clamp(14px, calc(1.45vh + 2px), 18px);
  line-height: 1.5;
  font-synthesis: none;
}
.dt-setup > * { flex: none; width: 100%; max-width: 1320px; margin-inline: auto; }
/* Wider on big screens, so the match panel is about 950px across and the theme thumbnails can be read. */
@media (min-width: 1600px) { .dt-setup > * { max-width: 1520px; } }
.dt-setup :where(h1, h2, p) { margin: 0; }
.dt-setup :where(button) {
  margin: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  cursor: pointer;
}
.dt-setup button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.dt-setup-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3em 1.6em; }
.dt-setup-head h1 {
  font-family: var(--font-title);
  font-size: 1.9em;
  font-weight: 600;
  letter-spacing: .3em;
}
/* The mark: one bar, half each side's colour, like a free debate's segment on the progress bar. */
.dt-setup-head h1::before {
  content: "";
  display: inline-block;
  width: .2em;
  height: .95em;
  margin-right: .65em;
  border-radius: .04em;
  vertical-align: -.1em;
  background: linear-gradient(var(--pro) 50%, var(--con) 50%);
}
.dt-setup-head p { color: var(--ink-dim); letter-spacing: .14em; }

.dt-setup-label {
  font-size: .8em;
  font-weight: normal;
  letter-spacing: .32em;
  color: var(--ink-dim);
}

/* Resume banner: the one gold surface on the page, since it asks for a decision. */
.dt-setup-resume {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: .8em 2em;
  padding: .75em .8em .75em 1.4em;
  border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent);
  border-radius: .6em;
  background: color-mix(in oklab, var(--accent) 8%, var(--ground));
  box-shadow: inset 3px 0 0 var(--accent);
}
.dt-setup-resume p { letter-spacing: .06em; }
.dt-setup-resume strong { font-family: var(--font-title); font-weight: 600; letter-spacing: .08em; }
.dt-setup-resume-acts { display: flex; gap: .6em; }
/* A match file's question on opening a match left part way: the banner alone, larger, in the middle of the page. */
.dt-setup.dt-setup-ask > * { max-width: 900px; }
.dt-setup-ask .dt-setup-resume { padding: 1.1em 1.1em 1.1em 1.6em; font-size: 1.12em; }
.dt-setup-ask-words { display: flex; flex-direction: column; gap: .3em; }

.dt-setup-body {
  flex: 0 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(16em, 25em) minmax(0, 1fr);
  gap: var(--gap);
}

/* Format list: a quiet column; the chosen one is lifted and marked with an ink bar. */
.dt-setup-formats { display: flex; flex-direction: column; gap: .7em; min-height: 0; }
.dt-setup-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  border-top: 1px solid var(--panel-line);
  outline: none;
}
.dt-setup-group-label { padding: 1.1em 1em .35em; font-size: .78em; letter-spacing: .32em; color: var(--ink-dim); }
.dt-setup-format {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: .3em;
  padding: .85em 1em .95em 1.2em;
  border-bottom: 1px solid var(--panel-line);
  cursor: pointer;
  transition: background 150ms ease;
}
.dt-setup-format:hover { background: var(--panel-hover); }
.dt-setup-format[aria-selected="true"] { background: color-mix(in oklab, var(--ink) 10%, transparent); }
.dt-setup-format[aria-selected="true"]::before {
  content: "";
  position: absolute;
  left: 0;
  top: .85em;
  bottom: .85em;
  width: 3px;
  border-radius: 2px;
  background: var(--ink);
}
.dt-setup-list:focus-visible .dt-setup-format[aria-selected="true"] { outline: 2px solid var(--accent); outline-offset: -2px; }
.dt-setup-format-name {
  overflow: hidden;
  font-family: var(--font-title);
  font-size: 1.1em;
  letter-spacing: .06em;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.dt-setup-format-meta { display: flex; gap: 1.2em; font-size: .85em; letter-spacing: .06em; color: var(--ink-dim); }
.dt-setup-format .dt-setup-strip { margin-top: .35em; opacity: .5; transition: opacity 150ms ease; }
.dt-setup-format:hover .dt-setup-strip, .dt-setup-format[aria-selected="true"] .dt-setup-strip { opacity: 1; }

/* This match: a panel headed by the chosen format and its shape. When the window is too short for all of it
   (1366×768 with the resume banner), the panel scrolls and its footer stays pinned, so 开始这一场 is always
   in view. */
.dt-setup-match {
  align-self: start;
  display: flex;
  flex-direction: column;
  gap: clamp(.75em, 1.3vh, 1.2em);   /* tighter on short screens */
  min-width: 0;
  max-height: 100%;
  overflow: auto;
  overscroll-behavior: contain;
  scroll-padding-bottom: 6em;   /* a focused field is scrolled clear of the pinned footer */
  scrollbar-width: thin;
  scrollbar-color: var(--panel-line) transparent;
  padding: clamp(1em, 2.4vh, 1.5em) 2em 0;
  border: 1px solid var(--panel-line);
  border-radius: .9em;
  background: var(--panel);
  box-shadow: var(--panel-shadow);
}
/* The format's name with its size beside it on one line (a long name pushes the size under it), its shape below. */
.dt-setup-chosen {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0 1.3em;
  padding-bottom: clamp(.8em, 1.8vh, 1.2em);
  border-bottom: 1px solid var(--panel-line);
}
.dt-setup-chosen-name {
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  font-family: var(--font-title);
  font-size: 1.65em;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: .1em;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.dt-setup-meta { letter-spacing: .08em; color: var(--ink-dim); }
.dt-setup-chosen .dt-setup-strip { flex: 1 0 100%; height: .5em; gap: 3px; margin-top: clamp(.6em, 1.4vh, .9em); }

.dt-setup-row { display: flex; flex-direction: column; gap: .5em; min-width: 0; margin: 0; padding: 0; border: 0; }
.dt-setup-row > legend { margin-bottom: .5em; padding: 0; }
.dt-setup .dt-input { padding-block: .45em; }   /* a little slimmer than the editor's, for the theme grid's sake */
/* Wide screens: each row's label in a column on its left. The panel has the width to spare and not the height,
   and the rows it saves let two rows of theme thumbnails large enough to tell apart fit at 1920×1080 and at
   1366×768 alike. A floated legend is not the fieldset's rendered legend, so it is laid out as a grid item like
   the rest. */
@media (min-width: 1200px) {
  .dt-setup-match .dt-setup-row { display: grid; grid-template-columns: 5.4em minmax(0, 1fr); align-items: start; gap: .5em 1.2em; }
  .dt-setup-match .dt-setup-row > .dt-setup-label { float: left; grid-column: 1; margin: 0; padding-top: .9em; }
  .dt-setup-match .dt-setup-row > :not(.dt-setup-label) { grid-column: 2; }
  .dt-setup-match .dt-setup-row:has(> .dt-setup-themes) > .dt-setup-label { padding-top: .1em; }   /* level with the thumbnails' top */
}
/* The team boxes in seat order, left to right as on the projector, with the swap button between them. */
.dt-setup-seating { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: .5em .8em; }
.dt-setup-swap {
  display: grid;
  place-items: center;
  width: 2.3em;
  height: 2.3em;
  border: 1px solid var(--panel-line);
  border-radius: 50%;
  color: var(--ink-dim);
  transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
}
.dt-setup-swap:hover { border-color: color-mix(in oklab, var(--ink) 45%, transparent); background: var(--panel-hover); color: var(--ink); }
.dt-setup-swap svg {
  width: 1.05em;
  height: 1.05em;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: rotate 200ms ease;
}
/* The arrows turn with each swap, so the click visibly did something even before the eye finds the boxes. */
.dt-setup-seating[data-seat="right"] .dt-setup-swap svg { rotate: 180deg; }

/* A side's label with its colour bar, then the box. */
.dt-setup-side { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); align-items: center; }
.dt-setup-side > span { position: relative; padding-left: .85em; font-size: .9em; letter-spacing: .2em; color: var(--ink-dim); }
.dt-setup-side > span::before {
  content: "";
  position: absolute;
  left: 0;
  top: .15em;
  bottom: .15em;
  width: 3px;
  border-radius: 2px;
  background: var(--pro);
}
.dt-setup-side[data-side="con"] > span::before { background: var(--con); }

/* Theme thumbnails (spec §3.1): each is the real stage in that theme, four to a row, the name under it, at every
   size (at 1366×768 too, where eight in a row came out 88px wide, too small to see the ink, the chalk or the
   dots), so ↑↓ always move between the two rows. The chosen one wears a gold ring; keyboard focus adds the page's
   focus outline around the whole cell. */
.dt-setup-themes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .75em .7em; }
@media (max-height: 860px) and (min-width: 1200px) {
  .dt-setup-themes { gap: .45em .7em; }
}
.dt-setup-theme {
  display: flex;
  flex-direction: column;
  gap: .4em;
  min-width: 0;
  padding: 0;
  border-radius: .4em;
  color: var(--ink-dim);
  text-align: left;
  transition: color 150ms ease;
}
.dt-setup .dt-setup-theme:focus-visible { outline-offset: 4px; }
.dt-setup-thumb {
  display: block;
  aspect-ratio: 16 / 9;
  border-radius: .35em;
  pointer-events: none;
  /* What the stage inherits on the projector, not this page's type: the thumbnail is the same frame, smaller. */
  font-size: 1rem;
  font-weight: normal;
  line-height: normal;
  letter-spacing: normal;
  text-align: start;
}
/* The ring is drawn inside the thumbnail, over the stage, so nothing reaches past the panel's pinned footer. */
.dt-setup-thumb::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  border-radius: inherit;
  box-shadow: inset 0 0 0 1px var(--panel-line);
  transition: box-shadow 150ms ease;
}
.dt-setup-theme:hover { color: var(--ink); }
.dt-setup-theme:hover .dt-setup-thumb::after { box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--ink) 50%, transparent); }
.dt-setup-theme[aria-checked="true"] { color: var(--ink); }
.dt-setup-theme[aria-checked="true"] .dt-setup-thumb::after { box-shadow: inset 0 0 0 2px var(--accent); }
.dt-setup-theme-name {
  overflow: hidden;
  padding-left: .1em;
  font-size: .88em;
  line-height: 1.3;
  letter-spacing: .16em;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.dt-setup-hint { font-size: .85em; letter-spacing: .06em; color: var(--ink-dim); }
.dt-setup-hint:empty { display: none; }

.dt-setup-foot {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: .8em;
  position: sticky;
  bottom: 0;
  z-index: 1;
  margin-top: auto;
  padding: clamp(.8em, 1.8vh, 1.2em) 0 clamp(1em, 2.2vh, 1.4em);
  border-top: 1px solid var(--panel-line);
  background: var(--panel);
}
/* When the panel has more below the footer, the rows fade into it instead of being cut by its rule. It is
   drawn only while the panel can scroll (a scroll-linked animation has no effect otherwise), and it clears
   as the end comes into view. */
.dt-setup-foot::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 100%;
  height: 2.5em;
  background: linear-gradient(transparent, var(--panel));
  pointer-events: none;
  opacity: 0;
  animation: dt-setup-more linear both;
  animation-timeline: scroll(nearest block);
}
@keyframes dt-setup-more { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
.dt-setup-foot [data-action="edit"] { margin-right: auto; }
.dt-setup .dt-button:hover { background: var(--panel-hover); }
/* Primary: solid ink, the loudest thing on this page and the only solid button. */
.dt-setup .dt-button[data-primary] { border-color: var(--ink); background: var(--ink); color: var(--ground); font-weight: 600; }
.dt-setup .dt-button[data-primary]:hover { background: color-mix(in oklab, var(--ink) 86%, var(--ground)); }
.dt-setup-start { padding: .7em 2.4em; font-size: 1.06em; letter-spacing: .3em; }
/* 导出这一场: a plain button like 编辑赛制, beside the one solid one; greyed in the dev shell, which has no
   single file to copy. */
.dt-setup [data-action="export"] { padding: .7em 1.4em; }
.dt-setup .dt-button:disabled { opacity: .45; cursor: default; }
.dt-setup .dt-button:disabled:hover { background: none; }

/* The notice drops in from the top edge like the stage's toast, and folds away again. */
.dt-setup > .dt-setup-notice {
  position: fixed;
  top: 0;
  left: 50%;
  z-index: 2;
  width: max-content;
  max-width: min(92vw, 44em);
  margin: 0;
  padding: .8em 1.8em;
  border-bottom: 2px solid var(--accent);
  border-radius: 0 0 .7em .7em;
  background: var(--panel);
  box-shadow: 0 .6em 1.6em rgb(0 0 0 / .28);
  color: var(--ink);
  letter-spacing: .06em;
  translate: -50% -110%;
  transition: translate 200ms cubic-bezier(.2, .8, .2, 1);   /* the stage toast's --ease-out */
}
.dt-setup > .dt-setup-notice[data-shown] { translate: -50% 0; }
.dt-setup > .dt-setup-notice:empty { visibility: hidden; }
@media (prefers-reduced-motion: reduce) { .dt-setup > .dt-setup-notice { transition: none; } }

@media (max-width: 760px) {
  .dt-setup-body { grid-template-columns: minmax(0, 1fr); }
  .dt-setup-list { max-height: 40vh; }
  /* One column: the whole page scrolls, as before, with the footer at the end of the panel. */
  .dt-setup-body { flex: none; }
  .dt-setup-match { max-height: none; overflow: visible; }
  .dt-setup-foot { position: static; }
  .dt-setup-foot::before { display: none; }
}

/* ---- format editor ---- */

/* A full-screen sheet that rises from the bottom. It wears the default theme (editor.js sets data-theme), so it
   reads the same over any match; the panel variables are set here because it may open outside .dt-app. */
.dt-editor {
  --panel: color-mix(in oklab, var(--ground) 91%, var(--ink));
  --panel-line: color-mix(in oklab, var(--ink) 15%, transparent);
  --panel-hover: color-mix(in oklab, var(--ink) 9%, transparent);
  --ed-error: color-mix(in oklab, var(--pro) 50%, var(--ink));
  --ed-error-line: color-mix(in oklab, var(--pro) 82%, var(--ink));
  --ed-ease: cubic-bezier(.2, .8, .2, 1);
  position: fixed;
  z-index: 50;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--ground);
  color: var(--ink);
  color-scheme: dark;
  font-family: var(--font-ui);
  font-size: clamp(13px, calc(1.3vh + 2px), 17px);
  line-height: 1.5;
  font-synthesis: none;
  outline: none;
  animation: dt-editor-in 260ms var(--ed-ease) both;
}
.dt-editor[data-leaving] { animation: dt-editor-out 260ms cubic-bezier(.5, 0, .75, .3) both; pointer-events: none; }
.dt-editor[data-still] { animation: none; }
@keyframes dt-editor-in { from { translate: 0 100%; } }
@keyframes dt-editor-out { to { translate: 0 100%; } }

.dt-editor :where(h1, h2, p) { margin: 0; }
/* Zero specificity, so .dt-button and the editor's own button rules win. */
:where(.dt-editor) button {
  margin: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  cursor: pointer;
}
.dt-editor button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dt-editor button:disabled { opacity: .32; cursor: default; }
.dt-editor .dt-button:hover:not(:disabled) { background: var(--panel-hover); }
.dt-editor .dt-button[data-primary] { border-color: var(--ink); background: var(--ink); color: var(--ground); font-weight: 600; }
.dt-editor .dt-button[data-primary]:hover { background: color-mix(in oklab, var(--ink) 86%, var(--ground)); }

.dt-ed-head {
  display: flex;
  align-items: center;
  gap: 1.6em;
  padding: .85em clamp(16px, 3vw, 44px);
  border-bottom: 1px solid var(--panel-line);
}
.dt-ed-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2em 1.4em; margin-right: auto; }
.dt-ed-title h1 { font-family: var(--font-title); font-size: 1.45em; font-weight: 600; letter-spacing: .26em; }
.dt-ed-title h1::before {
  content: "";
  display: inline-block;
  width: .2em;
  height: .95em;
  margin-right: .65em;
  border-radius: .04em;
  vertical-align: -.1em;
  background: linear-gradient(var(--pro) 50%, var(--con) 50%);
}
.dt-ed-title p { font-size: .9em; letter-spacing: .12em; color: var(--ink-dim); }
.dt-ed-head [data-action="close"] { padding: .5em 2.2em; letter-spacing: .3em; }

/* 已保存 fades in and out; an unsaved draft keeps its warning up until it is fixed. */
.dt-ed-status { font-size: .92em; letter-spacing: .12em; color: var(--ink-dim); opacity: 0; transition: opacity 300ms ease; }
.dt-ed-status[data-shown] { opacity: 1; }
.dt-ed-status[data-kind="saved"]::before { content: "✓"; margin-right: .5em; color: var(--accent); }
.dt-ed-status[data-kind="invalid"] { color: var(--ed-error); }

.dt-ed-body { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(15em, 19em) minmax(0, 1fr); }

/* The format list and its tools. */
.dt-ed-side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--panel-line); }
.dt-ed-list { flex: 1 1 auto; min-height: 0; overflow: auto; padding-bottom: .8em; }
.dt-ed-group-label { padding: 1.1em 1.4em .35em; font-size: .78em; letter-spacing: .32em; color: var(--ink-dim); }
.dt-ed-format {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: .12em;
  width: 100%;
  padding: .6em 1.2em .65em 1.4em;
  text-align: left;
  transition: background 150ms ease;
}
.dt-ed-format:hover { background: var(--panel-hover); }
.dt-ed-format[aria-current="true"] { background: color-mix(in oklab, var(--ink) 10%, transparent); }
.dt-ed-format[aria-current="true"]::before {
  content: "";
  position: absolute;
  left: 0;
  top: .6em;
  bottom: .6em;
  width: 3px;
  border-radius: 2px;
  background: var(--ink);
}
.dt-ed-format-name {
  overflow: hidden;
  font-family: var(--font-title);
  font-size: 1.04em;
  letter-spacing: .05em;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.dt-ed-format-meta { font-size: .8em; letter-spacing: .04em; color: var(--ink-dim); }
.dt-ed-format-meta em {
  margin-left: .8em;
  padding: 0 .45em;
  border: 1px solid color-mix(in oklab, var(--accent) 50%, transparent);
  border-radius: .3em;
  font-style: normal;
  color: var(--accent);
}
.dt-ed-empty { padding: .3em 1.4em; font-size: .85em; line-height: 1.6; color: var(--ink-dim); }

.dt-ed-tools {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: .4em;
  padding: .9em 1.2em;
  border-top: 1px solid var(--panel-line);
}
.dt-ed-tools .dt-button { padding: .42em .3em; font-size: .9em; letter-spacing: .06em; white-space: nowrap; }
.dt-ed-notice { max-height: 30vh; overflow: auto; padding: 0 1.2em; font-size: .86em; line-height: 1.55; }
.dt-ed-notice p { margin-bottom: .75em; letter-spacing: .03em; color: var(--ink-dim); }
.dt-ed-notice p[data-kind="bad"] { color: var(--ed-error); }

/* The form. */
.dt-ed-main { position: relative; min-height: 0; overflow: auto; padding: .4em clamp(16px, 3vw, 48px) 5em; }
.dt-ed-main > * { max-width: 74em; }
.dt-ed-section { padding: 1.2em 0 1.4em; border-bottom: 1px solid var(--panel-line); }
.dt-ed-section:last-child { border-bottom: 0; }
.dt-ed-h2 { margin-bottom: .8em; font-size: .8em; font-weight: normal; letter-spacing: .32em; color: var(--ink-dim); }
.dt-ed-section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2em 1.4em; margin-bottom: .6em; }
.dt-ed-section-head .dt-ed-h2 { margin-bottom: 0; }
.dt-ed-meta, .dt-ed-hint { font-size: .85em; letter-spacing: .05em; color: var(--ink-dim); }
.dt-ed-hint { margin-top: .7em; }
.dt-ed-hint:empty { display: none; }

.dt-ed-field { display: flex; align-items: center; gap: .6em; min-width: 0; }
.dt-ed-label { flex: none; font-size: .86em; letter-spacing: .14em; color: var(--ink-dim); white-space: nowrap; }
.dt-ed-unit { flex: none; color: var(--ink-dim); }
.dt-ed-short { width: 6em; }
.dt-ed-secs { width: 5.4em; text-align: center; font-family: var(--font-digits); font-variant-numeric: tabular-nums; letter-spacing: .03em; }
.dt-ed-select { width: auto; padding-block: .45em; cursor: pointer; }
.dt-editor .dt-input[aria-invalid="true"] { border-color: var(--ed-error-line); box-shadow: 0 0 0 1px var(--ed-error-line); }
.dt-ed-msg { font-size: .88em; letter-spacing: .04em; color: var(--ed-error); }
.dt-ed-msg:empty { display: none; }
.dt-ed-main > .dt-ed-msg { margin-top: 1em; }

/* Name and theme on one line; the name box is the one big serif field on the page. */
.dt-ed-format-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1em 2.4em; }
.dt-ed-format-head .dt-ed-field { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .4em .8em; }
.dt-ed-format-head .dt-ed-field > :nth-child(n+3) { grid-column: 2; margin: 0; }
.dt-ed-grow { flex: 1 1 22em; }
.dt-ed-name { font-size: 1.3em; font-weight: 600; letter-spacing: .08em; }
.dt-ed-bells { display: flex; flex-wrap: wrap; align-items: center; gap: .7em 2.2em; }

/* Stage rows: handle, number, name, type, side, time, details, remove. The header row uses the same columns. */
.dt-ed-line {
  display: grid;
  grid-template-columns: 1.5em 1.7em minmax(9em, 1fr) 11.6em 9.8em 6.6em 2em 2em;
  align-items: center;
  gap: .55em;
}
.dt-ed-cols { padding: 0 .6em .3em 1em; color: var(--ink-dim); }
/* Sized on the labels, not the row, so the header keeps the rows' em-based columns. */
.dt-ed-cols span { font-size: .76em; letter-spacing: .22em; }
.dt-ed-cols span:nth-child(6) { text-align: right; }
.dt-ed-stagebox { position: relative; }
.dt-ed-stages { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
.dt-ed-stage {
  position: relative;
  padding: .36em .6em .36em 1em;
  border-radius: .5em;
  transition: background 150ms ease, opacity 150ms ease;
}
.dt-ed-stage:hover, .dt-ed-stage:focus-within { background: color-mix(in oklab, var(--ink) 5%, transparent); }
.dt-ed-stage[data-dragging] { opacity: .45; }
/* The side's colour down the row's edge, as on the progress bar. */
.dt-ed-stage::before {
  content: "";
  position: absolute;
  left: .2em;
  top: .6em;
  bottom: .6em;
  width: 3px;
  border-radius: 2px;
  background: color-mix(in oklab, var(--ground) 50%, var(--ink));
}
.dt-ed-stage[data-tone="pro"]::before { background: var(--pro); }
.dt-ed-stage[data-tone="con"]::before { background: var(--con); }
.dt-ed-stage[data-tone="dual"]::before { background: linear-gradient(var(--pro) 50%, var(--con) 50%); }
.dt-ed-stage .dt-input { padding: .36em .6em; }
.dt-ed-stage > .dt-ed-msg { margin: .3em 0 .15em calc(3.2em + 1.1em); }
/* A message only about the duration sits under that box: right-aligned, clear of the two icon columns
   (2em each plus a .55em gap, in the row's em; the message's own em is .88 of it). */
.dt-ed-stage > .dt-ed-msg[data-about="secs"] { margin-left: 0; margin-right: calc((2em + .55em) * 2 / .88); text-align: right; }

.dt-ed-handle {
  height: 2em;
  border-radius: .35em;
  color: var(--ink-dim);
  font-size: 1.1em;
  line-height: 1;
  cursor: grab;
  touch-action: none;
}
.dt-ed-handle:hover { background: var(--panel-hover); color: var(--ink); }
.dt-ed-stage[data-dragging] .dt-ed-handle { cursor: grabbing; }
.dt-ed-index { font-family: var(--font-digits); font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-dim); }

/* Segmented choices: 单方 / 双方 / 间隔 and 正 / 反; a pressed side wears its colour. */
.dt-ed-seg {
  display: inline-flex;
  padding: 2px;
  border: 1px solid var(--panel-line);
  border-radius: .45em;
  background: color-mix(in oklab, var(--ground) 72%, transparent);
}
.dt-ed-seg-btn {
  padding: .26em .72em;
  border-radius: .3em;
  color: var(--ink-dim);
  letter-spacing: .1em;
  white-space: nowrap;
  transition: background 150ms ease, color 150ms ease;
}
.dt-ed-seg-btn:hover { background: var(--panel-hover); color: var(--ink); }
.dt-ed-seg-btn[aria-pressed="true"] { background: color-mix(in oklab, var(--ink) 16%, transparent); color: var(--ink); }
.dt-ed-seg-btn:is([data-side="pro"], [data-first="pro"])[aria-pressed="true"] { background: var(--pro); }
.dt-ed-seg-btn:is([data-side="con"], [data-first="con"])[aria-pressed="true"] { background: var(--con); }
.dt-ed-line > .dt-ed-seg { justify-self: start; }
